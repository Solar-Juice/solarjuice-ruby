        `ETag`; send it back in `If-None-Match` when polling and the API answers
        `304 Not Modified` with no body while nothing has changed. A `304` still
        counts against the rate limit, so poll at a sensible interval (30 seconds
        or more) or use `GET /v1/orders?updated_since=` to poll all orders in one
        request.
      parameters:
        - $ref: '#/components/parameters/orderId'
        - $ref: '#/components/parameters/ifNoneMatch'
