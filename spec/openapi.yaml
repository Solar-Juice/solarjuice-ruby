    get:
      tags: [Orders]
      operationId: listOrders
      summary: List this channel's orders
      description: |
        Returns orders placed with this channel's keys, cursor paginated,
        **oldest first by `updated_at`**. The order is deliberate: it is what
        makes the `updated_since` sync loop work, because a walk that starts
        at the oldest change and pages forward cannot skip an order that
        changes while you are paging.

        Filter by `status` and use `updated_since` to poll for status changes
        efficiently: pass the `as_of` from the last page you read and you
        receive every order whose status or details changed at or after it.
        `as_of` is the newest `updated_at` on the page, so the order you
        already have comes back once more on the next poll; match on `id` and
        skip it.

        Pass `client_reference` to fetch the single order carrying your own
        reference, which is how to find an order again after a request timed
        out before you saw its `id`.

        A key only ever lists its own side of the sandbox boundary: a
        `sj_test_` key sees sandbox orders, a `sj_live_` key sees live ones.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/updated_since'
        - name: status
          in: query
          description: Return only orders currently in this status.
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: client_reference
          in: query
          description: Return the order with this `client_reference`, if any.
          required: false
          schema:
            type: string
            examples: [PO-88213]
      responses:
