openapi: 3.1.0

info:
  title: Solar Juice Partner API
  version: 1.0.0
  summary: Catalogue, pricing, inventory, specials, shipping quotes and orders for Solar Juice sales channels.
  description: |
    # Overview

    The Solar Juice Partner API lets an approved sales channel (a partner with a
    Solar Juice trade account) read its own price list, sellable inventory and
    granted specials, obtain freight quotes that match the Solar Outlet checkout
    exactly, and place orders against its trade account.

    Everything a channel sees is scoped to that channel: the prices returned are
    the channel's prices, the specials are the specials granted to the channel,
    and the orders are the orders placed with the channel's keys. There is no
    way to see another channel's data.

    There is one base URL. Sandbox is not a separate host: a sandbox key
    (`sj_test_...`) is accepted by the same service as a production key
    (`sj_live_...`), against the same catalogue, the same prices and the same
    inventory, and freight quotes are real. What differs is the effect: orders
    placed with a `sj_test_` key are stored with `sandbox: true`, never reach
    operations, and are listed back to you flagged. Use a test key to build
    against, then swap in a live key with no other change.

    # Authentication

    Every request except `GET /v1/health` must carry a bearer token:

    ```
    Authorization: Bearer sj_live_k7m3qp2xr9vt_9f2c4b1e7a6d8c3f5e0b2a4d6c8e1f3a
    ```

    A key has the form `sj_<env>_<keyid>_<secret>` where `env` is `live` or
    `test`, `keyid` is 12 lower case base32 characters and `secret` is 32
    hexadecimal characters. The full key is shown once when it is issued; only the prefix
    `sj_live_<keyid>` is visible afterwards. Store the full key in a secrets
    manager, never in source control. A key can be revoked at any time, after
    which every request with it returns `401 UNAUTHORIZED`.

    Keys carry scopes. A request to an operation outside the key's scopes returns
    `403 FORBIDDEN`. Stage 1 scopes are `catalogue:read`, `inventory:read`,
    `specials:read`, `shipping:quote`, `orders:read` and `orders:write`.

    # Rate limits

    Limits are enforced per key with a sliding one minute window. The default
    allowance is 600 requests per minute; a different allowance can be agreed
    per key. Every response carries:

    | Header | Meaning |
    |---|---|
    | `RateLimit-Limit` | Requests allowed per window for this key |
    | `RateLimit-Remaining` | Requests remaining in the current window |
    | `RateLimit-Reset` | Seconds until the window resets |

    When the allowance is exhausted the API returns `429 RATE_LIMITED` with a
    `Retry-After` header in seconds. Back off for at least that long. Repeated
    429s without backing off may lead to the key being throttled further.

    # Request ids

    Every response carries `X-Request-Id` (for example
    `req_01J6ZK3M5X8QW2R7Y9V4B1N0PD`). The same value is repeated as
    `request_id` inside every error body. Quote it when raising a support
    request; it lets Solar Juice find the exact request in the logs.

    # Pagination and `updated_since`

    All list endpoints are cursor paginated:

    * `limit` sets the page size. Default 100, maximum 500.
    * `cursor` is an opaque string taken from the previous page's
      `next_cursor`. Do not construct or decode it.
    * Every list response carries `next_cursor`. It is `null` on the last page.
    * Every list response carries `as_of`, the freshest source timestamp
      behind the data on the page.

    A cursor is valid for the query it was issued with. Changing `limit`,
    `updated_since` or any filter between pages invalidates it and returns
    `422 VALIDATION_FAILED`.

    Catalogue, inventory, specials and orders accept `updated_since=<ISO 8601>`
    and return only items changed at or after that instant. The filter is
    driven by the service's own change sequence, not the underlying product
    record's edit time, so it is safe to pass the `as_of` value from your last
    response: you will receive everything changed since, and nothing will be
    skipped because of clock differences. A sync loop is therefore:

    1. Fetch all pages of `/v1/catalogue` with no `updated_since`; remember `as_of`.
    2. Periodically fetch `/v1/catalogue?updated_since=<as_of>` and apply the changes.
    3. Store the new `as_of`.

    Inventory tuples that drop to zero are still returned by `updated_since`
    queries (with `total: 0`) so a client can clear them.

    # Idempotency

    `POST /v1/orders` is idempotent on `client_reference`. Each channel has a
    unique `client_reference` per order (for example your purchase order
    number). Submitting the same `client_reference` with an identical body
    returns the original `202` receipt; submitting it with a different body
    returns `409 IDEMPOTENCY_CONFLICT`. An optional `Idempotency-Key` header is
    accepted and recorded but `client_reference` is the key that matters.

    `POST /v1/shipping/quotes` is not idempotent; every call produces a new
    `quote_id`. Quotes are cheap to request and expire quickly, so request a
    fresh one when the cart or destination changes.

    # Versioning and deprecation

    The API is versioned in the path (`/v1`). Within a version, Solar Juice may
    add new fields to responses, add new optional request fields, add new
    endpoints and add new values to enumerations that are documented as open
    (order status, error code). Clients must ignore fields they do not know.

    Breaking changes ship as a new path version. When a version is deprecated
    Solar Juice gives at least 12 months notice. During that period every
    response from the deprecated version carries a `Deprecation` header and a
    `Sunset` header (RFC 8594) with the date after which it will stop
    responding. Deprecation notices are also sent to the technical contact
    registered for each channel.

    # Money and timestamps

    * Money is a decimal string with exactly two decimal places, in AUD and
      exclusive of GST unless the field name says otherwise: `"1234.50"`.
      Never a float. `gst` and `total` on an order are the exceptions: `gst`
      is the GST amount and `total` is inclusive of GST.
    * Quantities are integers.
    * Timestamps are UTC ISO 8601 with a `Z` suffix: `2026-09-02T04:10:11Z`.
    * SKUs are Solar Juice part numbers, case sensitive, for example
      `GW-5000-DNS-30`.
    * Metro names are title case: `Sydney`, `Melbourne`, `Brisbane`, `Perth`,
      `Adelaide`, `Townsville`.

    # Caching

    Priced responses are per channel and are served with
    `Cache-Control: private, no-store`. `GET /v1/orders/{id}` returns an `ETag`
    and honours `If-None-Match` with a `304`. There is no edge cache: every
    request reaches the API and counts against the rate limit.

    # Errors

    Every error response, whatever the status code, has the same body:

    ```json
    {
      "error": {
        "code": "PRICE_CHANGED",
        "message": "Human readable explanation",
        "details": [],
        "request_id": "req_01J6ZK3M5X8QW2R7Y9V4B1N0PD"
      }
    }
    ```

    | Code | HTTP | When |
    |---|---|---|
    | `UNAUTHORIZED` | 401 | Missing, malformed, revoked or wrong-environment key |
    | `FORBIDDEN` | 403 | Key lacks the scope for this operation, or the channel is suspended |
    | `NOT_FOUND` | 404 | No such SKU, order or route for this channel |
    | `VALIDATION_FAILED` | 422 | Request body or query does not validate; `details` lists each problem |
    | `RATE_LIMITED` | 429 | Per key allowance exhausted; honour `Retry-After` |
    | `PRICE_CHANGED` | 409 | Order line prices or `price_list_version` no longer match; `details` carries current values |
    | `IDEMPOTENCY_CONFLICT` | 409 | Same `client_reference` submitted with a different body |
    | `QUOTE_UNAVAILABLE` | 503 | Freight engine temporarily unreachable; honour `Retry-After` |
    | `STALE_DATA` | 503 | The catalogue or inventory behind this request is older than the safety threshold and the operation cannot be served safely |
    | `INTERNAL` | 500 | Unexpected failure; retry with backoff and report the `request_id` if it persists |

  termsOfService: https://dev.solarjuice.com.au/terms
  contact:
    name: Solar Juice Developer Program
    url: https://dev.solarjuice.com.au
    email: developers@solarjuice.com.au
  license:
    name: Solar Juice Partner API Terms
    url: https://dev.solarjuice.com.au/terms

servers:
  - url: https://api.solarjuice.com.au
    description: >-
      The API. Accepts both sj_live_ and sj_test_ keys; a test key puts the
      request in sandbox mode, where orders are stored flagged and never reach
      operations.

security:
  - bearerAuth: []

tags:
  - name: Catalogue
    description: Products available to this channel with the channel's own price. Kits are excluded in stage 1.
  - name: Inventory
    description: Sellable quantity per metro, identical to what the Solar Outlet storefront sees. The API does not reserve stock.
  - name: Specials
    description: Time boxed price reductions granted to this channel. Granted specials are already reflected in catalogue prices.
  - name: Shipping
    description: Freight quotes produced by the same engine as the Solar Outlet checkout. A quote is required to place an order.
  - name: Orders
    description: Orders placed against this channel's trade account. Acceptance is asynchronous; poll the order for status.
  - name: Health
    description: Unauthenticated liveness check.

paths:
  /v1/catalogue:
    get:
      tags: [Catalogue]
      operationId: listCatalogue
      summary: List catalogue products with this channel's prices
      description: |
        Returns every active product this channel can buy, with the channel's
        current price per SKU. `list_price` is the public list price (the
        compare-at figure) and `price` is what this channel pays; when a granted
        special is the reason `price` is lower, `special` carries its id.

        The response header `X-Price-List-Version` (also present as
        `price_list_version` in the body) identifies the price list the page was
        priced from. Send it back on `POST /v1/orders`; if the list has changed in
        between, the order is refused with `409 PRICE_CHANGED` and you should
        refresh.

        Supports cursor pagination and `updated_since`; see the introduction.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/updated_since'
        - name: brand
          in: query
          description: Exact brand name filter, for example `GoodWe`.
          required: false
          schema:
            type: string
            examples: [GoodWe]
        - name: category
          in: query
          description: Exact category filter, for example `Inverter`, `Panel`, `Battery`, `Rail`.
          required: false
          schema:
            type: string
            examples: [Inverter]
      responses:
        '200':
          description: A page of catalogue products.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Price-List-Version:
              $ref: '#/components/headers/X-Price-List-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueList'
              examples:
                firstPage:
                  summary: First page of two products, more pages follow
                  value:
                    as_of: '2026-09-02T04:10:11Z'
                    price_list_version: '2026-09-02T04:00:00Z'
                    items:
                      - sku: GW-5000-DNS-30
                        title: GoodWe 5kW Single Phase Hybrid Inverter
                        brand: GoodWe
                        category: Inverter
                        list_price: '1234.50'
                        price: '1110.99'
                        special: null
                        weight_kg: '18.50'
                        images:
                          - https://cdn.shopify.com/s/files/1/0000/0000/products/gw-5000-dns-30.jpg
                        updated_at: '2026-09-02T04:10:11Z'
                      - sku: JKM-440N-54HL4-V
                        title: Jinko Tiger Neo 440W N-Type Mono
                        brand: Jinko
                        category: Panel
                        list_price: '145.00'
                        price: '119.00'
                        special: spc_01J6ZK3M5X8QW2R7Y9V4B1N0PD
                        weight_kg: '21.80'
                        images:
                          - https://cdn.shopify.com/s/files/1/0000/0000/products/jkm-440n.jpg
                        updated_at: '2026-09-01T22:30:00Z'
                    next_cursor: eyJ1cGRhdGVkX2F0IjoiMjAyNi0wOS0wMVQyMjozMDowMFoiLCJza3UiOiJKS00tNDQwTi01NEhMNC1WIn0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/StaleData'

  /v1/catalogue/{sku}:
    get:
      tags: [Catalogue]
      operationId: getCatalogueProduct
      summary: Get one catalogue product
      description: |
        Returns one product with this channel's current price. `404 NOT_FOUND`
        is returned for SKUs that do not exist, are not active, or are kits
        (excluded in stage 1). The `X-Price-List-Version` header is the version
        to submit with an order for this SKU.
      parameters:
        - $ref: '#/components/parameters/sku'
      responses:
        '200':
          description: The product.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Price-List-Version:
              $ref: '#/components/headers/X-Price-List-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueProduct'
              examples:
                product:
                  summary: A product priced with the channel discount, no special
                  value:
                    sku: GW-5000-DNS-30
                    title: GoodWe 5kW Single Phase Hybrid Inverter
                    brand: GoodWe
                    category: Inverter
                    list_price: '1234.50'
                    price: '1110.99'
                    special: null
                    weight_kg: '18.50'
                    images:
                      - https://cdn.shopify.com/s/files/1/0000/0000/products/gw-5000-dns-30.jpg
                    updated_at: '2026-09-02T04:10:11Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/StaleData'

  /v1/inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: List sellable inventory per metro
      description: |
        Returns sellable quantity (on hand minus committed) per metro for every
        SKU in this channel's catalogue that has stock. The figures are exactly
        the ones the Solar Outlet storefront sells from, refreshed on the same
        schedule.

        * `locations` lists every metro the service knows about. `available`
          on each item only contains metros with a non zero quantity.
        * `as_of` is the freshest source timestamp in the data, `as_of_oldest`
          the stalest. The `X-Inventory-As-Of` header repeats `as_of`.
        * `stale` is `true` when the inventory feed is older than the
          configured threshold (default two hours). Treat stale figures as
          indicative only; orders are still accepted subject to availability.

        The API does not reserve stock. An order is accepted subject to
        availability and may later move to `on_hold` or `rejected` if stock
        cannot be allocated.

        Supports cursor pagination and `updated_since`; with `updated_since`,
        SKUs whose stock has dropped to zero are returned with `total: 0` and an
        empty `available` map so you can clear them.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/updated_since'
      responses:
        '200':
          description: A page of inventory items.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Inventory-As-Of:
              $ref: '#/components/headers/X-Inventory-As-Of'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryList'
              examples:
                lastPage:
                  summary: Final page, one SKU has just gone to zero
                  value:
                    as_of: '2026-09-02T04:10:11Z'
                    as_of_oldest: '2026-09-02T03:55:00Z'
                    stale: false
                    locations: [Sydney, Melbourne, Brisbane, Perth, Adelaide, Townsville]
                    items:
                      - sku: GW-5000-DNS-30
                        available:
                          Sydney: 12
                          Melbourne: 4
                        total: 16
                        updated_at: '2026-09-02T04:10:11Z'
                      - sku: JKM-440N-54HL4-V
                        available: {}
                        total: 0
                        updated_at: '2026-09-02T04:08:40Z'
                    next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/StaleData'

  /v1/inventory/{sku}:
    get:
      tags: [Inventory]
      operationId: getInventoryItem
      summary: Get sellable inventory for one SKU
      description: |
        Returns the per metro sellable quantity for one SKU together with the
        feed timestamps. A SKU that exists in the catalogue but has no stock
        anywhere returns `200` with `total: 0`; a SKU that is not in this
        channel's catalogue returns `404 NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/sku'
      responses:
        '200':
          description: Inventory for the SKU.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Inventory-As-Of:
              $ref: '#/components/headers/X-Inventory-As-Of'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemDetail'
              examples:
                inStock:
                  summary: Stock in two metros
                  value:
                    as_of: '2026-09-02T04:10:11Z'
                    as_of_oldest: '2026-09-02T03:55:00Z'
                    stale: false
                    locations: [Sydney, Melbourne, Brisbane, Perth, Adelaide, Townsville]
                    sku: GW-5000-DNS-30
                    available:
                      Sydney: 12
                      Melbourne: 4
                    total: 16
                    updated_at: '2026-09-02T04:10:11Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/StaleData'

  /v1/specials:
    get:
      tags: [Specials]
      operationId: listSpecials
      summary: List specials granted to this channel
      description: |
        Returns active and upcoming specials granted to this channel, one row
        per SKU. A campaign covering several SKUs appears as several rows
        sharing the same `name`.

        A special is either an absolute `special_price` or a `percent_off` the
        list price; exactly one of the two is non null. `effective_price` is
        the resulting price for this channel and is always populated, so most
        clients only need that field. Ended specials are not returned, except
        through `updated_since` where a row whose window has closed since your
        last sync is returned once so you can remove it.

        Granted specials are already folded into `price` on the catalogue, so
        this endpoint is for display (badges, countdowns, campaign pages) and
        for knowing when a price will change. Pass `active=true` to restrict
        the list to specials live right now.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/updated_since'
        - name: active
          in: query
          description: When `true`, return only specials whose window includes the current instant.
          required: false
          schema:
            type: boolean
            default: false
        - name: sku
          in: query
          description: Restrict to specials for one SKU.
          required: false
          schema:
            type: string
            examples: [GW-5000-DNS-30]
      responses:
        '200':
          description: A page of specials.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialsList'
              examples:
                twoSpecials:
                  summary: One absolute price special and one percentage special
                  value:
                    as_of: '2026-09-02T04:00:00Z'
                    items:
                      - id: spc_01J6ZK3M5X8QW2R7Y9V4B1N0PD
                        name: September panel clearance
                        sku: JKM-440N-54HL4-V
                        special_price: '119.00'
                        percent_off: null
                        effective_price: '119.00'
                        starts_at: '2026-09-01T00:00:00Z'
                        ends_at: '2026-09-30T13:59:59Z'
                        updated_at: '2026-08-29T02:15:00Z'
                      - id: spc_01J6ZK3M5X8QW2R7Y9V4B1N0PE
                        name: October inverter promo
                        sku: GW-5000-DNS-30
                        special_price: null
                        percent_off: '15.00'
                        effective_price: '1049.33'
                        starts_at: '2026-10-01T00:00:00Z'
                        ends_at: '2026-10-31T12:59:59Z'
                        updated_at: '2026-09-02T04:00:00Z'
                    next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/shipping/quotes:
    post:
      tags: [Shipping]
      operationId: createShippingQuote
      summary: Request a freight quote for a cart
      description: |
        Prices delivery of a set of lines to an Australian address. The engine
        behind this endpoint is the one that prices the Solar Outlet checkout,
        so a partner quote and a storefront quote for the same cart and address
        are identical, including dangerous goods handling for batteries.

        ## Quote status

        | `quote_status` | Meaning | Can I order with it? |
        |---|---|---|
        | `priced` | One or more carrier rates are available in `rates`. | Yes. Pass `quote_id` and the chosen `rate_service_code` to `POST /v1/orders` before `expires_at`. |
        | `manual_quote_required` | The cart or destination needs a human freight quote (typically oversize items, pallet quantities or remote postcodes). `rates` is empty. | Not through the API in stage 1. Contact your account manager with the `quote_id`. |
        | `unavailable` | No carrier can service this destination for these lines and no manual path applies. `rates` is empty. | No. |

        A `$0` rate is never returned. If the freight engine itself is
        unreachable the response is `503 QUOTE_UNAVAILABLE` with `Retry-After`;
        retry after that delay rather than treating it as `unavailable`.

        ## Origin

        Partners have no fulfilment location concept. The origin is the metro
        that can fulfil every line from stock, falling back to Sydney. You may
        pass `origin_metro` to force a particular origin, for example when the
        end customer will collect. The metro actually used is returned in
        `origin_metro`.

        ## Validity

        A quote expires at `expires_at` (typically 30 minutes). It is bound to
        the exact lines, quantities and destination it was requested with; an
        order that references it with different lines or a different address is
        refused with `422 VALIDATION_FAILED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingQuoteRequest'
            examples:
              residential:
                summary: Two products to a residential address
                value:
                  destination:
                    suburb: Parramatta
                    postcode: '2150'
                    state: NSW
                    country: AU
                    address_type: residential
                  lines:
                    - sku: GW-5000-DNS-30
                      quantity: 1
                    - sku: JKM-440N-54HL4-V
                      quantity: 12
              forcedOrigin:
                summary: Force the Brisbane warehouse as origin
                value:
                  destination:
                    suburb: Toowoomba City
                    postcode: '4350'
                    state: QLD
                    country: AU
                    address_type: business
                  lines:
