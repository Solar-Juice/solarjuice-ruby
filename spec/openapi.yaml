  /v1/shipping/quotes:
    post:
      tags: [Shipping]
      operationId: createShippingQuote
      summary: Request a freight quote for a cart
      description: |
        Prices delivery of a set of lines to an Australian address. The engine
        behind this endpoint is the one that prices the Solar Outlet checkout,
        so a partner quote and a storefront quote for the same cart and address
        are identical, including dangerous goods handling for batteries.

        Nothing here is priced from the `weight_kg` you see on the
        catalogue. Every consignment, kit or not, is planned from the
        product's shipping specification, meaning its packed dimensions and
        the weight recorded against that specification. `weight_kg` is
        published for information and the carrier never sees it, so an
        estimate you build from it will not match the rate you are quoted.
        Quote the cart and read `total_price`.

        Quote a kit as its own SKU. Listing its components instead describes
        a different cart, and the quote it returns cannot be used to order
        the kit anyway, because a quote is bound to the exact lines it was
        issued for.

        Some kits come back `manual_quote_required` rather than priced,
        usually because a single unit is too heavy to move on a standard
        pallet. That is a normal outcome for oversize goods rather than a
        fault, and retrying will not change it; take the `quote_id` to your
        account manager as the table below describes.

        ## Quote status

        | `quote_status` | Meaning | Can I order with it? |
        |---|---|---|
        | `priced` | One or more carrier rates are available in `rates`. | Yes. Pass `quote_id` and the chosen `rate_service_code` to `POST /v1/orders` before `expires_at`. |
        | `manual_quote_required` | The cart or destination needs a human freight quote (typically oversize items, pallet quantities or remote postcodes). `rates` is empty. | Not through the API in stage 1. Contact your account manager with the `quote_id`. |
        | `unavailable` | No carrier can service this destination for these lines and no manual path applies. `rates` is empty. | No. |

        A `$0` rate is never returned. If the freight engine itself is
        unreachable the response is `503 QUOTE_UNAVAILABLE` with `Retry-After`;
        retry after that delay rather than treating it as `unavailable`.

        ## Origin

        Partners have no fulfilment location concept, and the API does not
        choose an origin from stock. Every quote is priced from one configured
        default metro, Sydney, unless you pass `origin_metro`, in which case
        it is priced from the metro you name. Nothing checks that the origin
        can actually fulfil the lines.

        This has a money consequence for interstate carts. A Perth cart quoted
        from the Sydney default is priced as a cross country consignment even
        when the goods would ship from Perth. If you know where the stock is,
        read `/v1/inventory` and pass `origin_metro`; if you do not, quote the
        default and expect the freight figure to be conservative.

        The metro actually used is returned in `origin_metro`.

        ## Validity

        A quote expires at `expires_at`, 30 minutes after it was created. It is
        bound to the exact lines, quantities, destination and address type it
        was requested with, and to the key's channel and sandbox side; an order
        that references it with anything different is refused with
        `422 VALIDATION_FAILED`.

        Requesting a quote for a cart the API has just quoted returns the same
        `quote_id` again rather than a fresh one, for as long as it has at
        least five minutes of life left. Duplicate quotes for an unchanged cart
        are therefore free, but the clock does not restart: always read
        `expires_at` off the response you have rather than assuming 30 minutes
        from now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingQuoteRequest'
            examples:
              residential:
                summary: Two products to a residential address
                value:
                  destination:
                    suburb: Parramatta
                    postcode: '2150'
                    state: NSW
                    country: AU
                    address_type: residential
                  lines:
                    - sku: GW-5000-DNS-30
                      quantity: 1
                    - sku: JKM-440N-54HL4-V
                      quantity: 12
              forcedOrigin:
                summary: Force the Brisbane warehouse as origin
                value:
                  destination:
                    suburb: Toowoomba City
                    postcode: '4350'
                    state: QLD
                    country: AU
                    address_type: business
                  lines:
                    - sku: GW-5000-DNS-30
                      quantity: 2
                  origin_metro: Brisbane
      responses:
        '200':
          description: The quote. Check `quote_status` before reading `rates`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingQuote'
              examples:
                priced:
                  summary: Two rates available
                  value:
                    quote_id: qt_01j6zk3m5x8qw2r7y9v4b1n0pd
                    quote_status: priced
                    expires_at: '2026-09-02T04:45:00Z'
                    origin_metro: Sydney
                    rates:
                      - service_code: ALLIED-GENERAL
                        service_name: Road Freight
                        carrier: Allied Express
                        total_price: '123.45'
                        currency: AUD
                        eta_days_min: 2
                        eta_days_max: 4
                        dangerous_goods: false
                      - service_code: ALLIED-PRIORITY
                        service_name: Priority Road Freight
                        carrier: Allied Express
                        total_price: '189.90'
                        currency: AUD
                        eta_days_min: 1
                        eta_days_max: 2
                        dangerous_goods: false
                manualQuote:
                  summary: Pallet quantity needs a manual quote
                  value:
                    quote_id: qt_01j6zk3m5x8qw2r7y9v4b1n0pe
                    quote_status: manual_quote_required
                    expires_at: '2026-09-02T04:45:00Z'
                    origin_metro: Sydney
                    rates: []
                unavailable:
                  summary: Destination cannot be serviced
                  value:
                    quote_id: qt_01j6zk3m5x8qw2r7y9v4b1n0pf
                    quote_status: unavailable
                    expires_at: '2026-09-02T04:45:00Z'
                    origin_metro: Sydney
                    rates: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/QuoteUnavailable'

  /v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Place an order
      description: |
        Places an order against this channel's trade account. The end customer's
        name, phone and address are delivery details only; they are never used
        to create or match a customer record.

        ## What is validated

        Everything below happens before the response is written; nothing about
        acceptance is deferred.

        1. The body parses, carries no unknown fields, and is under 64 KiB.
           A parse failure or an unknown field is `400`, an oversized body is
           `413`.
        2. Every field is within its length limit, the delivery postcode is
           four digits, the state is an Australian state or territory code,
           and `country` is `AU` (the only value supported). A missing
           `country` defaults to `AU`.
        3. Line SKUs are distinct. Two lines for the same SKU are refused
           rather than merged: send one line with the combined quantity. Every
           `quantity` is between 1 and 9999, and there are at most 200 lines.
        4. Every `sku` exists and is active in this channel's catalogue.
        5. Every `unit_price` equals the channel's current price for that SKU
           **and** `price_list_version` equals the current version. Otherwise
           `409 PRICE_CHANGED` is returned with the current values in
           `details`; refresh the catalogue and resubmit.
        6. `quote_id` is valid, unexpired, was issued by this channel with a
           key on this side of the sandbox boundary, for the same lines,
           destination and address type, and `rate_service_code` is one of its
           rates. Otherwise `422 VALIDATION_FAILED`.
        7. `client_reference` has not been used by this channel with a
           different body, otherwise `409 IDEMPOTENCY_CONFLICT`.

        A kit is one line: the kit's SKU, the kit's `unit_price` and the
        number of kits. If kit delivery is not enabled on your channel the
        line fails step 4, in the same way and with the same message as a SKU
        that does not exist. Step 4 checks the kit itself is in the catalogue and
        step 5 checks the kit's own price, and stock is later allocated
        against the kit's derived availability rather than against each
        component in turn. Do not expand a kit into one line per component:
        the components price separately, quote as a different consignment,
        and the bundle is lost. Splitting the kit for picking happens in the
        warehouse after acceptance.

        Totals are computed server side from the current price list and the
        chosen rate. The response is authoritative; do not trust client side
        arithmetic.

        ## What happens next

        Acceptance is synchronous. A `202` response already carries status
        `accepted` and two events, `received` and `accepted`: everything the
        API can check has been checked and the order is queued for operations.
        The status is `202` rather than `200` because fulfilment has not
        started, not because validation is still running.

        Resubmitting the same `client_reference` with the same body returns
        `200` with the order that already exists, at whatever status it has
        reached by then. Treat `200` and `202` the same way: read the order
        out of the body.

        Account level checks (credit hold, unapproved account) and stock
        allocation run in the back office afterwards and surface as `on_hold`
        or `rejected`. Poll `GET /v1/orders/{id}` (using `If-None-Match`) or
        `GET /v1/orders?updated_since=` to track it. The full state machine is
        documented on the `Order` schema.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            examples:
              standard:
                summary: A two line order using a priced quote
                value:
                  client_reference: PO-88213
                  price_list_version: plv_9f3a2c1d84b6e05
                  quote_id: qt_01j6zk3m5x8qw2r7y9v4b1n0pd
                  rate_service_code: ALLIED-GENERAL
                  delivery:
                    name: Jane Citizen
                    company: Example Solar Pty Ltd
                    phone: '+61400000000'
                    email: jane@example.com
                    address1: 12 Example Street
                    address2: Unit 4
                    suburb: Parramatta
                    postcode: '2150'
                    state: NSW
                    country: AU
                    instructions: Leave at side gate if no answer
                    address_type: business
                  lines:
                    - sku: GW-5000-DNS-30
                      quantity: 1
                      unit_price: '1110.99'
                    - sku: JKM-440N-54HL4-V
                      quantity: 12
                      unit_price: '119.00'
                  partner_note: Installer job 4471
      responses:
        '200':
          description: |
            This `client_reference` has already been used by this channel with
            the same body, so no second order was created. The body is the
            existing order at its current status.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '202':
          description: |
            The order has been validated, priced and recorded with status
            `accepted`. `202` says fulfilment has not started, not that
            validation is outstanding. A replay of the same
            `client_reference` and body answers `200`, not `202`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              description: URL of the created order.
              schema:
                type: string
                examples: [/v1/orders/ord_01j6zk3m5x8qw2r7y9v4b1n0pd]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                accepted:
                  summary: The order immediately after submission
                  value:
                    id: ord_01j6zk3m5x8qw2r7y9v4b1n0pd
                    channel_id: ch_01j6zk3m5x8qw2r7y9v4b1n0pd
                    api_key_id: key_01j6zk3m5x8qw2r7y9v4b1n0pd
