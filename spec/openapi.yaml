  /v1/inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: List sellable inventory per metro
      description: |
        Returns sellable quantity (on hand minus committed) per metro for
        every SKU the inventory feed carries stock for. The figures are
        exactly the ones the Solar Outlet storefront sells from, refreshed on
        the same schedule.

        Inventory is not scoped per channel in stage 1: the feed is one set of
        figures shared by every channel, so this listing can contain a SKU
        that is not in your catalogue. Join to `/v1/catalogue` if you need
        only the products you can buy.

        * `locations` lists every metro the service knows about. `available`
          on each item only contains metros with a non zero quantity.
        * `as_of` is the freshest source timestamp in the data, `as_of_oldest`
          the stalest. The `X-Inventory-As-Of` header repeats `as_of`.
        * `stale` is `true` when the inventory feed is older than the
          configured threshold (default two hours). Treat stale figures as
          indicative only; orders are still accepted subject to availability.

        The API does not reserve stock. An order is accepted subject to
        availability and may later move to `on_hold` or `rejected` if stock
        cannot be allocated.

        ## Kits

        Kits appear in this feed only when kit delivery is enabled on your
        channel; with it off there are simply no kit rows, and a kit SKU
        behaves like any other SKU the feed has never heard of. Your account
        manager arranges it.

        A kit holds no stock of its own, so the figures returned for a kit
        SKU are derived from the products in its `components` list. Within
        one metro:

        ```
        available = floor( min over components of ( component_available / quantity ) )
        ```

        A component with no inventory row in that metro contributes zero, so
        the kit is zero there: absence means "cannot ship", not "unknown".
        The division is integer and floored, so three panels against a kit
        that needs two of them is one kit.

        `total` for a kit is the sum of those per metro figures, not a
        minimum taken against national component totals. The two differ
        whenever a kit's components are spread across the country, and ours
        is deliberately the smaller: a kit ships from one metro, so a
        battery in Perth cannot complete a kit in Sydney. Computing it the
        other way advertises kits that no single warehouse can assemble.

        A kit that cannot be assembled at all, because a component is
        inactive or missing, or whose weight cannot be resolved, is absent
        from this feed as well as from the catalogue rather than reported as
        zero.

        Supports cursor pagination and `updated_since`; with `updated_since`,
        SKUs whose stock has dropped to zero are returned with `total: 0` and an
        empty `available` map so you can clear them.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/updated_since'
      responses:
        '200':
          description: A page of inventory items.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Inventory-As-Of:
              $ref: '#/components/headers/X-Inventory-As-Of'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryList'
              examples:
                lastPage:
                  summary: Final page, one SKU has just gone to zero
                  value:
                    as_of: '2026-09-02T04:10:11Z'
                    as_of_oldest: '2026-09-02T03:55:00Z'
                    stale: false
                    locations: [Sydney, Melbourne, Brisbane, Perth, Adelaide, Townsville]
                    items:
                      - sku: GW-5000-DNS-30
                        available:
                          Sydney: 12
                          Melbourne: 4
                        total: 16
                        updated_at: '2026-09-02T04:10:11Z'
                      - sku: JKM-440N-54HL4-V
                        available: {}
                        total: 0
                        updated_at: '2026-09-02T04:08:40Z'
                    next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/StaleData'

