components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sj_live_<keyid>_<secret> or sj_test_<keyid>_<secret>
      description: |
        Partner API key issued by Solar Juice. Format
        `sj_<env>_<keyid>_<32 hex secret>`. Both `sj_live_` and `sj_test_` keys
        are accepted on the same host; a `sj_test_` key puts the request in
        sandbox mode. Send as `Authorization: Bearer <full key>`. Keys carry
        scopes; an operation outside the key's scopes returns `403 FORBIDDEN`.

  parameters:
    limit:
      name: limit
      in: query
      description: Page size. Default 100, maximum 500.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`. Omit for the first page.
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    updated_since:
      name: updated_since
      in: query
      description: |
        Return only items changed at or after this UTC instant. Safe to pass the
        `as_of` value from your previous response; see the introduction.
      required: false
      schema:
        $ref: '#/components/schemas/Timestamp'
    sku:
      name: sku
      in: path
      description: Solar Juice part number. Case sensitive.
      required: true
      schema:
        $ref: '#/components/schemas/Sku'
    orderId:
      name: id
      in: path
      description: Order id as returned by `POST /v1/orders`.
      required: true
      schema:
        $ref: '#/components/schemas/OrderId'
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from a previous response. When it still matches, the API returns `304` with no body.
      required: false
      schema:
        type: string
        examples: ['"a1b2c3d4e5f6"']
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Optional. Recorded with the order for your own reconciliation. The
        idempotency key that governs behaviour is `client_reference` in the body.
      required: false
      schema:
        type: string
        maxLength: 255
        examples: [3f2c9b7e-1c4a-4a2e-9a1f-0b7d5e6c8a90]

  headers:
    X-Request-Id:
      description: Unique id for this request. Quote it in support requests. Repeated as `request_id` in error bodies.
      schema:
        $ref: '#/components/schemas/RequestId'
    RateLimit-Limit:
      description: Requests allowed per one minute sliding window for this key.
      schema:
        type: integer
        minimum: 0
        examples: [600]
    RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
        examples: [597]
    RateLimit-Reset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        minimum: 0
        examples: [42]
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        examples: [30]
    X-Price-List-Version:
      description: Version of the price list the response was priced from. Submit it as `price_list_version` on orders.
      schema:
        $ref: '#/components/schemas/PriceListVersion'
    X-Inventory-As-Of:
      description: Freshest source timestamp behind the inventory figures in the response.
      schema:
        $ref: '#/components/schemas/Timestamp'
    ETag:
      description: Entity tag for the order representation. Send back in `If-None-Match`.
      schema:
        type: string
        examples: ['"a1b2c3d4e5f6"']

  responses:
    Unauthorized:
      description: Missing, malformed, revoked or wrong environment API key.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: API key is missing, invalid or revoked.
                  details: []
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    Forbidden:
      description: The key does not have the scope for this operation, or the channel is suspended.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: This key does not have the orders:write scope.
                  details:
                    - field: scope
                      message: orders:write required
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    NotFound:
      description: No such resource for this channel.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: SKU GW-5000-DNS-99 is not in this channel's catalogue.
                  details: []
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    ValidationFailed:
      description: The request did not validate. `details` lists every problem found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            badQuantity:
              summary: Quantity out of range
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request body is invalid.
                  details:
                    - field: lines[1].quantity
                      message: must be between 1 and 9999
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
            quoteMismatch:
              summary: Quote does not match the order lines
              value:
                error:
                  code: VALIDATION_FAILED
                  message: quote_id was issued for different lines or destination.
                  details:
                    - field: quote_id
                      message: quote lines do not match order lines
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    RateLimited:
      description: The key's allowance for the current window is exhausted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: Rate limit of 600 requests per minute exceeded.
                  details: []
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    OrderConflict:
      description: |
        Either the prices submitted no longer match the channel's current price
        list (`PRICE_CHANGED`, refresh the catalogue and resubmit with the
        current `unit_price` values and `price_list_version` from `details`) or
        this `client_reference` was already used with a different body
        (`IDEMPOTENCY_CONFLICT`, choose a new reference or fetch the existing
        order).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            priceChanged:
              summary: A line price and the version are both out of date
              value:
                error:
                  code: PRICE_CHANGED
                  message: One or more prices no longer match the current price list.
                  details:
                    - field: lines[0].unit_price
                      sku: GW-5000-DNS-30
                      submitted: '1110.99'
                      current: '1099.00'
                    - field: price_list_version
                      submitted: '2026-09-01T22:00:00Z'
                      current: '2026-09-02T04:00:00Z'
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
            idempotencyConflict:
              summary: client_reference reused with a different body
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: client_reference PO-88213 was already submitted with a different body.
                  details:
                    - field: client_reference
                      message: existing order ord_01J6ZK3M5X8QW2R7Y9V4B1N0PD
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    QuoteUnavailable:
      description: The freight engine is temporarily unreachable. Retry after the `Retry-After` delay.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            quoteUnavailable:
              value:
                error:
                  code: QUOTE_UNAVAILABLE
                  message: Freight quoting is temporarily unavailable.
                  details: []
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    StaleData:
      description: |
        The catalogue or inventory data behind this request is older than the
        safety threshold, or has not been loaded yet, and the operation cannot
        be served safely. Retry after the `Retry-After` delay.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            staleData:
              value:
                error:
                  code: STALE_DATA
                  message: Catalogue data is older than the safety threshold; orders are paused.
                  details:
                    - field: catalogue.as_of
                      current: '2026-09-02T01:10:11Z'
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD
    Internal:
      description: Unexpected failure. Retry with backoff; report the `request_id` if it persists.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL
                  message: An unexpected error occurred.
                  details: []
                  request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD

  schemas:
    # Primitives

    Money:
      type: string
      description: Decimal amount with exactly two decimal places, AUD, exclusive of GST unless the field name says otherwise. Never a float.
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      examples: ['1234.50']

    Percent:
      type: string
      description: Percentage as a decimal string with two decimal places, for example `"15.00"` for 15 percent.
      pattern: '^[0-9]+\.[0-9]{2}$'
      examples: ['15.00']

    Timestamp:
      type: string
      format: date-time
      description: UTC ISO 8601 with a `Z` suffix.
      examples: ['2026-09-02T04:10:11Z']

    PriceListVersion:
      type: string
      format: date-time
      description: |
        Identifies the channel's current price list. It is the ISO 8601 timestamp
        of the most recent change to any input of the channel's prices (base
        prices, channel discount, per SKU overrides, granted specials) and changes
        whenever any of them changes. Treat it as opaque: compare for equality,
        never for ordering.
      examples: ['2026-09-02T04:00:00Z']

    Sku:
      type: string
      description: Solar Juice part number. Case sensitive.
      minLength: 1
      maxLength: 64
      examples: [GW-5000-DNS-30]

    Cursor:
      type: string
      description: Opaque pagination cursor. Do not construct or decode.
      examples: [eyJ1cGRhdGVkX2F0IjoiMjAyNi0wOS0wMVQyMjozMDowMFoiLCJza3UiOiJKS00tNDQwTi01NEhMNC1WIn0]

    RequestId:
      type: string
      description: Request id, `req_` followed by a 26 character ULID.
      pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [req_01J6ZK3M5X8QW2R7Y9V4B1N0PD]

    OrderId:
      type: string
      description: Order id, `ord_` followed by a 26 character ULID.
      pattern: '^ord_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [ord_01J6ZK3M5X8QW2R7Y9V4B1N0PD]

    ChannelId:
      type: string
      description: Channel id, `ch_` followed by a 26 character ULID. Identifies your sales channel.
      pattern: '^ch_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [ch_01J6ZK3M5X8QW2R7Y9V4B1N0PD]

    SpecialId:
      type: string
      description: Special id, `spc_` followed by a 26 character ULID.
      pattern: '^spc_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [spc_01J6ZK3M5X8QW2R7Y9V4B1N0PD]

    QuoteId:
      type: string
      description: Shipping quote id as returned by `POST /v1/shipping/quotes`. Opaque.
      minLength: 1
      maxLength: 64
      examples: [qte_01J6ZK3M5X8QW2R7Y9V4B1N0PD]

    Metro:
      type: string
      description: Metro name in title case. The set may grow; treat unknown values as new metros.
      examples: [Sydney, Melbourne, Brisbane, Perth, Adelaide, Townsville]

    AustralianState:
      type: string
      description: Australian state or territory abbreviation.
      enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT]

    # Errors

    ErrorCode:
      type: string
      description: |
        Machine readable error code. Open enumeration; new codes may be added
        with notice. Clients should fall back on the HTTP status for unknown
        codes.

        * `UNAUTHORIZED` (401): missing, malformed, revoked or wrong environment key.
        * `FORBIDDEN` (403): key lacks the scope, or the channel is suspended.
        * `NOT_FOUND` (404): no such SKU, order or route for this channel.
        * `VALIDATION_FAILED` (422): request does not validate; see `details`.
        * `RATE_LIMITED` (429): allowance exhausted; honour `Retry-After`.
        * `PRICE_CHANGED` (409): order prices or version out of date; current values in `details`.
        * `IDEMPOTENCY_CONFLICT` (409): `client_reference` reused with a different body.
        * `QUOTE_UNAVAILABLE` (503): freight engine unreachable; honour `Retry-After`.
        * `STALE_DATA` (503): backing data too old to serve this operation safely.
        * `INTERNAL` (500): unexpected failure.
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - PRICE_CHANGED
        - IDEMPOTENCY_CONFLICT
        - QUOTE_UNAVAILABLE
        - STALE_DATA
        - INTERNAL

    ErrorDetail:
      type: object
      description: |
        One problem with the request. `field` is a JSON path into the request
        body or the query parameter name. For `PRICE_CHANGED`, `submitted` and
        `current` carry the value you sent and the value the API now holds.
        Additional keys may be present.
      properties:
        field:
          type: string
          description: JSON path into the request body, or a query or header name.
          examples: ['lines[0].unit_price']
        sku:
          $ref: '#/components/schemas/Sku'
        message:
          type: string
          description: Human readable explanation of this detail.
          examples: [must be between 1 and 9999]
        submitted:
          type: string
          description: The value you sent (PRICE_CHANGED).
          examples: ['1110.99']
        current:
          type: string
          description: The value the API currently holds (PRICE_CHANGED, STALE_DATA).
          examples: ['1099.00']
      additionalProperties: true

    Error:
      type: object
      required: [code, message, details, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human readable explanation. Do not parse; use `code`.
          examples: [One or more prices no longer match the current price list.]
        details:
          type: array
          description: Zero or more specific problems. Empty when there is nothing to add.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          $ref: '#/components/schemas/RequestId'

    ErrorEnvelope:
      type: object
      description: The body of every error response, whatever the status code.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
      examples:
        - error:
            code: NOT_FOUND
            message: SKU GW-5000-DNS-99 is not in this channel's catalogue.
            details: []
            request_id: req_01J6ZK3M5X8QW2R7Y9V4B1N0PD

    # Catalogue

    CatalogueProduct:
      type: object
      description: A product priced for this channel.
      required: [sku, title, brand, category, list_price, price, special, weight_kg, images, updated_at]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        title:
          type: string
          description: Product title as shown on Solar Outlet.
          examples: [GoodWe 5kW Single Phase Hybrid Inverter]
        brand:
          type: string
          examples: [GoodWe]
        category:
          type: string
          description: Product category. `Rail`, `Panel` and `Battery` are used by the freight engine; other values are the product's category string.
          examples: [Inverter]
        list_price:
          $ref: '#/components/schemas/Money'
          description: Public list price, ex GST. The compare-at figure. Never below `price`.
        price:
          $ref: '#/components/schemas/Money'
          description: This channel's price, ex GST, after channel discount, per SKU override and any granted special. Submit as `unit_price` on orders.
        special:
          oneOf:
            - $ref: '#/components/schemas/SpecialId'
            - type: 'null'
          description: Id of the granted special that produced `price`, or `null` when no special applies.
        weight_kg:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Unit weight in kilograms, two decimal places.
          examples: ['18.50']
        images:
          type: array
          description: Public image URLs, primary first. May be empty.
          items:
            type: string
            format: uri
            examples: [https://cdn.shopify.com/s/files/1/0000/0000/products/gw-5000-dns-30.jpg]
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When this product, or its price for this channel, last changed.

    CatalogueList:
      type: object
      required: [as_of, price_list_version, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: Freshest source timestamp behind this page. Safe to pass as `updated_since` on the next sync.
        price_list_version:
          $ref: '#/components/schemas/PriceListVersion'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueProduct'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    # Inventory

    AvailableByMetro:
      type: object
      description: Sellable quantity keyed by metro name. Metros with zero stock are omitted.
      additionalProperties:
        type: integer
        minimum: 0
      examples:
        - Sydney: 12
          Melbourne: 4

    InventoryItem:
      type: object
      required: [sku, available, total, updated_at]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        available:
          $ref: '#/components/schemas/AvailableByMetro'
        total:
          type: integer
          minimum: 0
          description: Sum of `available` across all metros.
          examples: [16]
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When this SKU's figures last changed.

    InventoryList:
      type: object
      required: [as_of, as_of_oldest, stale, locations, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: Freshest source timestamp in the feed.
        as_of_oldest:
          $ref: '#/components/schemas/Timestamp'
          description: Stalest source timestamp in the feed.
        stale:
          type: boolean
          description: True when the feed is older than the configured threshold (default two hours).
        locations:
          type: array
          description: Every metro the service tracks, whether or not any item on this page has stock there.
          items:
            $ref: '#/components/schemas/Metro'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    InventoryItemDetail:
      type: object
      description: One SKU's inventory together with the feed timestamps.
      required: [as_of, as_of_oldest, stale, locations, sku, available, total, updated_at]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
        as_of_oldest:
          $ref: '#/components/schemas/Timestamp'
        stale:
          type: boolean
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Metro'
        sku:
          $ref: '#/components/schemas/Sku'
        available:
          $ref: '#/components/schemas/AvailableByMetro'
        total:
          type: integer
          minimum: 0
          examples: [16]
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    # Specials

    Special:
      type: object
      description: |
        A time boxed price for one SKU granted to this channel. Exactly one of
        `special_price` and `percent_off` is non null; `effective_price` is the
        resulting price either way.
      required: [id, name, sku, special_price, percent_off, effective_price, starts_at, ends_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/SpecialId'
        name:
          type: string
          description: Campaign name. Rows for several SKUs in one campaign share it.
          examples: [September panel clearance]
        sku:
          $ref: '#/components/schemas/Sku'
        special_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Absolute special price ex GST, or `null` for a percentage special.
        percent_off:
          oneOf:
            - $ref: '#/components/schemas/Percent'
            - type: 'null'
          description: Percentage off list price, or `null` for an absolute price special.
        effective_price:
          $ref: '#/components/schemas/Money'
          description: The price this special produces for this channel, ex GST.
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
          description: Inclusive end of the window.
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    SpecialsList:
      type: object
      required: [as_of, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Special'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    # Shipping

    Destination:
      type: object
      description: Where the goods are going. Australian addresses only.
      required: [suburb, postcode, state]
      properties:
        suburb:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Parramatta]
        postcode:
          type: string
          pattern: '^[0-9]{4}$'
          examples: ['2150']
        state:
          $ref: '#/components/schemas/AustralianState'
        country:
          type: string
          enum: [AU]
          default: AU
          description: Only `AU` is supported.
        address_type:
          type: string
          enum: [residential, business]
          default: residential
          description: Residential deliveries may attract a surcharge or different carrier; say which it is.

    QuoteLine:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
          examples: [12]

    ShippingQuoteRequest:
      type: object
      required: [destination, lines]
      properties:
        destination:
          $ref: '#/components/schemas/Destination'
        lines:
          type: array
          minItems: 1
          maxItems: 200
          description: Lines to ship. Duplicate SKUs are merged before quoting.
          items:
            $ref: '#/components/schemas/QuoteLine'
        origin_metro:
          $ref: '#/components/schemas/Metro'
          description: Optional. Force dispatch from this metro instead of the automatically chosen one.

    ShippingRate:
      type: object
      required: [service_code, service_name, carrier, total_price, currency, eta_days_min, eta_days_max, dangerous_goods]
      properties:
        service_code:
          type: string
          description: Stable code identifying the service. Submit as `rate_service_code` on the order.
          examples: [ALLIED-GENERAL]
        service_name:
          type: string
          description: Display name for the service.
          examples: [Road Freight]
        carrier:
          type: string
          examples: [Allied Express]
        total_price:
          $ref: '#/components/schemas/Money'
          description: Freight charge ex GST for the whole consignment, including any dangerous goods surcharge. Never `0.00`.
        currency:
          type: string
          enum: [AUD]
        eta_days_min:
          type: integer
          minimum: 0
          description: Earliest expected transit time in business days.
          examples: [2]
        eta_days_max:
          type: integer
          minimum: 0
          description: Latest expected transit time in business days.
          examples: [4]
        dangerous_goods:
          type: boolean
          description: True when the consignment is handled as dangerous goods (batteries) and the rate includes the DG surcharge.

    ShippingQuote:
      type: object
      description: |
        A freight quote. `quote_status` governs how to read it: `priced` means
        `rates` has at least one entry and the quote can be used on an order
        until `expires_at`; `manual_quote_required` means a person must quote
        (contact your account manager, quoting `quote_id`); `unavailable` means
        the destination cannot be serviced for these lines. `rates` is empty for
        the latter two.
      required: [quote_id, quote_status, expires_at, origin_metro, rates]
      properties:
        quote_id:
          $ref: '#/components/schemas/QuoteId'
        quote_status:
          type: string
          enum: [priced, manual_quote_required, unavailable]
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the quote can no longer be used on an order. `null` when `quote_status` is `unavailable`.
        origin_metro:
          $ref: '#/components/schemas/Metro'
          description: The metro the consignment was priced from.
        rates:
          type: array
          description: Available services, cheapest first. Empty unless `quote_status` is `priced`.
          items:
            $ref: '#/components/schemas/ShippingRate'

    # Orders

    OrderStatus:
      type: string
      description: |
        Partner facing order status. Open enumeration; see the `Order` schema
        for the state machine.
      enum: [received, accepted, on_hold, processing, dispatched, cancelled, rejected]

    DeliveryAddress:
      type: object
      description: End customer delivery details. Used for the consignment only; never used to create or match a customer record.
      required: [name, phone, address1, suburb, postcode, state]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Recipient name.
          examples: [Jane Citizen]
        company:
          type: [string, 'null']
          maxLength: 100
          examples: [Example Solar Pty Ltd]
        phone:
          type: string
          minLength: 6
          maxLength: 20
          description: Contact number for the carrier. E.164 or Australian local format.
          examples: ['+61400000000']
        email:
          type: [string, 'null']
          format: email
          description: Optional. Receives carrier tracking notifications if provided.
          examples: [jane@example.com]
        address1:
          type: string
          minLength: 1
          maxLength: 100
          examples: [12 Example Street]
        address2:
          type: [string, 'null']
          maxLength: 100
        suburb:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Parramatta]
        postcode:
          type: string
          pattern: '^[0-9]{4}$'
          examples: ['2150']
        state:
          $ref: '#/components/schemas/AustralianState'
        country:
          type: string
          enum: [AU]
          default: AU
        instructions:
          type: [string, 'null']
          maxLength: 500
          description: Delivery instructions passed to the carrier.
          examples: [Leave at side gate if no answer]

    OrderLineRequest:
      type: object
      required: [sku, quantity, unit_price]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
          examples: [12]
        unit_price:
          $ref: '#/components/schemas/Money'
          description: The `price` you were shown on the catalogue for this SKU, ex GST. Must equal the current channel price.

    OrderRequest:
      type: object
      required: [client_reference, price_list_version, quote_id, rate_service_code, delivery, lines]
      properties:
        client_reference:
          type: string
          minLength: 1
          maxLength: 64
          description: Your unique reference for this order (purchase order number). The idempotency key; unique per channel.
          examples: [PO-88213]
        price_list_version:
          $ref: '#/components/schemas/PriceListVersion'
          description: The `X-Price-List-Version` you priced the cart from.
        quote_id:
          $ref: '#/components/schemas/QuoteId'
          description: A `priced`, unexpired quote for exactly these lines and this delivery address.
        rate_service_code:
          type: string
          description: The `service_code` of the chosen rate on that quote.
          examples: [ALLIED-GENERAL]
        delivery:
          $ref: '#/components/schemas/DeliveryAddress'
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/OrderLineRequest'
        partner_note:
          type: [string, 'null']
          maxLength: 1000
          description: Free text for Solar Juice operations. Not shown to the end customer.
          examples: [Installer job 4471]

    OrderLine:
      type: object
      required: [sku, title, quantity, unit_price, line_total, special_id]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        title:
          type: string
          description: Product title at the time the order was received.
          examples: [GoodWe 5kW Single Phase Hybrid Inverter]
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
        unit_price:
          $ref: '#/components/schemas/Money'
          description: Ex GST unit price charged.
        line_total:
          $ref: '#/components/schemas/Money'
          description: The `unit_price` multiplied by `quantity`, ex GST.
        special_id:
          oneOf:
            - $ref: '#/components/schemas/SpecialId'
            - type: 'null'
          description: The special that set `unit_price`, or `null`.

    AppliedSpecial:
      type: object
      description: A special that reduced a line on this order. Recorded for redemption accounting.
      required: [special_id, sku, list_price, effective_price, quantity]
      properties:
        special_id:
          $ref: '#/components/schemas/SpecialId'
        sku:
          $ref: '#/components/schemas/Sku'
        list_price:
          $ref: '#/components/schemas/Money'
        effective_price:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1

    OrderEvent:
      type: object
      description: One status transition on the order.
      required: [status, note, actor, created_at]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        note:
          type: [string, 'null']
          description: Free text from the actor, for example a back office reference or a hold reason.
          examples: [Keyed to NetSuite SO-104233]
        actor:
          type: string
          description: Who made the transition. Open enumeration.
          enum: [system, ops, partner]
        created_at:
          $ref: '#/components/schemas/Timestamp'

    Order:
      type: object
      description: |
        An order placed by this channel. Totals are computed server side and are
        authoritative: `subtotal` and `shipping_total` are ex GST, `gst` is the
        GST amount, `total` is inclusive of GST.

        ## Status state machine

        ```
        received --> accepted --> processing --> dispatched
            |            |
            |            +--> on_hold --> processing
            |                    |
            +--> rejected        +--> rejected
        any of received, accepted, on_hold --> cancelled
        ```

        | Status | Meaning |
        |---|---|
        | `received` | Recorded by the API. Synchronous validation passed. Acceptance is pending. |
        | `accepted` | Passed all checks and is queued for operations. Reached within seconds in the normal case. |
        | `on_hold` | Held by the back office, typically an account check (credit hold, unapproved account) or stock allocation. `events[].note` says why. Resolves to `processing` or `rejected`. |
        | `processing` | Operations have keyed the order into the fulfilment system. The order can no longer be cancelled through the API. |
        | `dispatched` | Goods have left the warehouse. Stage 1 sets this manually; carrier tracking is a later addition. |
        | `cancelled` | Cancelled by operations or by the partner before `processing`. Terminal. |
        | `rejected` | Failed a check after receipt (for example account hold not cleared, stock not allocatable). `events[].note` says why. Terminal. |

        Every transition is appended to `events` with a timestamp, the actor and
        an optional note. `updated_at` moves with every transition, so
        `GET /v1/orders?updated_since=` picks up status changes. New statuses may
        be added with notice; treat the enumeration as open.
      required:
        - id
        - channel_id
        - client_reference
        - status
        - price_list_version
        - currency
        - subtotal
        - shipping_total
        - gst
        - total
        - quote_id
        - rate_service_code
        - delivery
        - lines
        - applied_specials
        - partner_note
        - sandbox
        - received_at
        - updated_at
        - events
      properties:
        id:
          $ref: '#/components/schemas/OrderId'
        channel_id:
          $ref: '#/components/schemas/ChannelId'
        client_reference:
          type: string
          examples: [PO-88213]
        status:
          $ref: '#/components/schemas/OrderStatus'
        price_list_version:
          $ref: '#/components/schemas/PriceListVersion'
          description: The version the order was priced against.
        currency:
          type: string
          enum: [AUD]
        subtotal:
          $ref: '#/components/schemas/Money'
          description: Sum of `lines[].line_total`, ex GST.
        shipping_total:
          $ref: '#/components/schemas/Money'
          description: Freight charge for the chosen rate, ex GST.
        gst:
          $ref: '#/components/schemas/Money'
          description: GST amount on `subtotal` plus `shipping_total`.
        total:
          $ref: '#/components/schemas/Money'
          description: Sum of `subtotal`, `shipping_total` and `gst`. Inclusive of GST.
        quote_id:
          $ref: '#/components/schemas/QuoteId'
        rate_service_code:
          type: string
          examples: [ALLIED-GENERAL]
        delivery:
          $ref: '#/components/schemas/DeliveryAddress'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        applied_specials:
          type: array
          items:
            $ref: '#/components/schemas/AppliedSpecial'
        partner_note:
          type: [string, 'null']
        sandbox:
          type: boolean
          description: True for orders placed with `sj_test_` keys. Sandbox orders never reach operations.
        received_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Time of the most recent change to the order, including status transitions.
        events:
          type: array
          description: Status history, oldest first.
          items:
            $ref: '#/components/schemas/OrderEvent'

    OrderList:
      type: object
      required: [as_of, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: Safe to pass as `updated_since` on the next poll.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    # Health

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
