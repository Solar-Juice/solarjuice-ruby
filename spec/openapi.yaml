openapi: 3.1.0

info:
  title: Solar Juice Partner API
  version: 1.0.0
  summary: Catalogue, pricing, inventory, specials, shipping quotes and orders for Solar Juice sales channels.
  description: |
    # Overview

    The Solar Juice Partner API lets an approved sales channel (a partner with a
    Solar Juice trade account) read its own price list, sellable inventory and
    granted specials, obtain freight quotes that match the Solar Outlet checkout
    exactly, and place orders against its trade account.

    Everything a channel sees is scoped to that channel: the prices returned are
    the channel's prices, the specials are the specials granted to the channel,
    and the orders are the orders placed with the channel's keys. There is no
    way to see another channel's data.

    There is one base URL. Sandbox is not a separate host: a sandbox key
    (`sj_test_...`) is accepted by the same service as a production key
    (`sj_live_...`), against the same catalogue, the same prices and the same
    inventory, and freight quotes are real. What differs is the effect: orders
    placed with a `sj_test_` key are stored with `sandbox: true`, never reach
    operations, and are listed back to you flagged. Use a test key to build
    against, then swap in a live key with no other change.

    # Getting started

    ## 1. Get a key

    Keys are minted in the developer portal at https://dev.solarjuice.com.au
    by an owner on your channel. Portal access is by invitation from your
    Solar Juice account manager.

    A key looks like `sj_live_<keyid>_<secret>` or, in the sandbox,
    `sj_test_<keyid>_<secret>`. Sandbox keys read the same shapes but never
    touch live stock or your trade account, so start there. The secret is
    shown once, at creation. Store it somewhere your application can read at
    runtime and never commit it.

    ## 2. Make a request

    Send the key as a bearer token. Every response carries `X-Request-Id`;
    quote it when you contact support.

    ```
    curl -sS https://api.solarjuice.com.au/v1/catalogue?limit=2 \
      -H "Authorization: Bearer $SOLARJUICE_API_KEY"
    ```

    Every list response has the same envelope. `items` holds the page,
    `next_cursor` is the cursor for the following page and is `null` on the
    last one, and `as_of` is the freshest source timestamp behind the page.

    ```
    {
      "as_of": "2026-09-02T02:14:07Z",
      "price_list_version": "plv_9f3a2c1d84b6e05",
      "stale": false,
      "items": [ ... ],
      "next_cursor": "U0tVLTAxMQ"
    }
    ```

    ## 3. Sync a catalogue

    Read every page once, keep `as_of`, then pass it back as
    `updated_since` on the next run so you only fetch what changed. The
    official SDKs do this walk for you.

    ## 4. Sell and order

    Quote freight with `POST /v1/shipping/quotes`, then place the order with
    `POST /v1/orders`, passing the `quote_id` and the `price_list_version`
    you sold at. Sending the version is what lets us reject an order that
    was priced against a stale list rather than silently repricing it.

    Set a `client_reference` (your purchase order number) on every order. It
    is the idempotency key: a retry after a timeout with the same
    `client_reference` and the same body returns the original order rather
    than creating a second one.

    ## Sandbox and live

    The sandbox is not a separate host. The same base URL serves both, and
    the key decides which environment you are in. Move to a live key only
    once your order flow works end to end against the sandbox.

    A sandbox key reads the real catalogue, the real prices and the real
    inventory, and its freight quotes are real quotes from the real engine.
    What it does not do is simulate fulfilment. A sandbox order is validated,
    priced and stored exactly as a live one, reaches `accepted`, and stops
    there: operations never see it, so it will never move to `processing` or
    `dispatched`, and no stock is committed. Test your cancellation path
    instead, which does work in the sandbox from `accepted`.

    # SDKs

    Official clients, each with zero runtime dependencies and a conformance
    test that fails if this specification grows an operation the client does
    not implement.

    | Language | Package | Source |
    | --- | --- | --- |
    | Node.js 18+ | `@solarjuice/partner-api` | https://github.com/Solar-Juice/solarjuice-node |
    | PHP 8.1+ | `solarjuice/partner-api` | https://github.com/Solar-Juice/solarjuice-php |
    | Ruby 3.0+ | `solarjuice-partner-api` | https://github.com/Solar-Juice/solarjuice-ruby |

    Each handles authentication, cursor pagination, conditional requests,
    retry with backoff on 429 and 5xx, and maps every error code below to
    its own exception class.

    You do not need one. The API is plain JSON over HTTPS and works with any
    HTTP client.

    # Authentication

    Every request except `GET /v1/health` must carry a bearer token:

    ```
    Authorization: Bearer sj_live_k7m3qp2xr9vt_9f2c4b1e7a6d8c3f5e0b2a4d6c8e1f3a
    ```

    A key has the form `sj_<env>_<keyid>_<secret>` where `env` is `live` or
    `test`, `keyid` is 12 lower case base32 characters and `secret` is 32
    hexadecimal characters. The full key is shown once when it is issued; only the prefix
    `sj_live_<keyid>` is visible afterwards. Store the full key in a secrets
    manager, never in source control. A key can be revoked at any time, after
    which every request with it returns `401 UNAUTHORIZED`.

    Keys carry scopes. A request to an operation outside the key's scopes returns
    `403 FORBIDDEN`. Stage 1 scopes are `catalogue:read`, `inventory:read`,
    `specials:read`, `shipping:quote`, `orders:read` and `orders:write`.

    # Rate limits

    Limits are enforced per key with a sliding one minute window. The default
    allowance is 600 requests per minute; a different allowance can be agreed
    per key. Every response carries:

    | Header | Meaning |
    |---|---|
    | `RateLimit-Limit` | Requests allowed per window for this key |
    | `RateLimit-Remaining` | Requests remaining in the current window |
    | `RateLimit-Reset` | Seconds until the window resets |

    When the allowance is exhausted the API returns `429 RATE_LIMITED` with a
    `Retry-After` header in seconds. Back off for at least that long. Repeated
    429s without backing off may lead to the key being throttled further.

    `GET /v1/health` is the one exception. It is unauthenticated, so there is
    no key to count against: it carries no `RateLimit-*` headers and never
    answers `429`.

    # Request ids

    Every response carries `X-Request-Id` (for example
    `req_01j6zk3m5x8qw2r7y9v4b1n0pd`). The same value is repeated as
    `request_id` inside every error body. Quote it when raising a support
    request; it lets Solar Juice find the exact request in the logs.

    # Pagination and `updated_since`

    All list endpoints are cursor paginated:

    * `limit` sets the page size. Default 100, maximum 500.
    * `cursor` is an opaque string taken from the previous page's
      `next_cursor`. Do not construct or decode it.
    * Every list response carries `next_cursor`. It is `null` on the last page.
    * Every list response carries `as_of`, the freshest source timestamp
      behind the data on the page.

    * A `limit` above 500 is clamped to 500 rather than refused. A `limit`
      that is not a positive integer, and a `cursor` that is not one the API
      issued, are both `400 VALIDATION_FAILED`.

    A cursor encodes a position, not a query. Changing `limit`,
    `updated_since` or a filter partway through a walk is accepted and simply
    resumes from that position under the new query, so the page you get back
    is the one the new query would have produced from there. Finish a walk
    with the parameters you started it with if you want a coherent snapshot.

    Catalogue, inventory, specials and orders accept `updated_since=<ISO 8601>`
    and return only items changed at or after that instant. The filter is
    driven by the service's own change sequence, not the underlying product
    record's edit time, so it is safe to pass the `as_of` value from your last
    response: you will receive everything changed since, and nothing will be
    skipped because of clock differences. A sync loop is therefore:

    1. Fetch all pages of `/v1/catalogue` with no `updated_since`; remember `as_of`.
    2. Periodically fetch `/v1/catalogue?updated_since=<as_of>` and apply the changes.
    3. Store the new `as_of`.

    Inventory tuples that drop to zero are still returned by `updated_since`
    queries (with `total: 0`) so a client can clear them.

    ## `updated_since` does not see every price change

    On the catalogue, `updated_at` tracks the product read model: it moves
    when the product record changes, including its list price. It does not
    move when the price you pay changes for any other reason. A special
    starting or ending, a change to your channel discount, or a per SKU
    override being added all change `price` while `updated_at` stands still,
    so a catalogue sync driven by `updated_since` alone will keep selling at
    yesterday's price.

    `X-Price-List-Version` is the reliable signal. It is derived from the
    resolved prices themselves, so it changes whenever any price in your
    catalogue changes, whatever the cause. Keep the last value you saw,
    compare the header on every response, and when it differs re-read the
    full catalogue rather than an `updated_since` slice. The version is also
    what `POST /v1/orders` checks: submitting an order against a version that
    is no longer current is `409 PRICE_CHANGED`.

    # Kits

    A kit is a bundle Solar Juice sells under one SKU, for example
    `Kit-14406`, a battery paired with an inverter. The kit itself holds no
    stock: it is assembled from ordinary catalogue products at the time it
    ships. On a channel where kits are enabled they appear in the catalogue
    and in the inventory feed alongside everything else and are ordered the
    same way, but their price, weight and available quantity are each
    arrived at differently, and a partner who assumes otherwise will
    disagree with us on all three.

    ## Whether you see kits at all

    Kit delivery is switched on per channel, and it is off until someone
    turns it on. A channel without it sees no kits anywhere: none in
    `/v1/catalogue`, none in `/v1/inventory`, `404 NOT_FOUND` from
    `GET /v1/catalogue/{sku}` for a kit SKU, and a quote or order line
    naming a kit refused exactly as one naming a SKU that does not exist.
    A kit is indistinguishable from a non existent product, deliberately,
    because a channel that is not selling kits has no business being told
    which ones it is missing.

    Nothing else about the responses changes. `is_kit` is still present on
    every product such a channel can see, and is simply always `false`, so
    a client written against kits works unmodified either way and starts
    seeing them the day the switch is flipped.

    So if you expect kits and get nothing but `404`s, do not go looking
    through your client: ask your Solar Juice account manager to enable kit
    delivery on your channel. There is no API call and no key scope that
    turns it on.

    Everything below this point describes a channel with kits enabled.

    Every catalogue product carries `is_kit`. It is `false` on an ordinary
    product, so branch on that field rather than on the SKU prefix, which is
    a naming habit and not part of this contract. A kit additionally carries
    `components`, one entry of `{sku, quantity}` per product it is assembled
    from. On a non kit the `components` key is absent rather than empty.

    * **Price is the kit's own.** `price` on a kit is a figure set by hand
      against the kit, not a total of its parts. Summing the components will
      not reproduce it. Sell and order the kit's `price`.
    * **Weight is the kit's own.** `weight_kg` on a kit is a weight recorded
      against the kit itself, exactly as it is on any other product. Only
      where a kit has no weight of its own is one worked out from the
      components, and a kit for which neither is possible is withheld rather
      than published. Do not reconstruct it from `components`: the per unit
      weights that derivation needs are not what `weight_kg` exposes on a
      component, so your figure would not be ours.
    * **Freight is not quoted from `weight_kg`.** For a kit and for every
      other product alike, `POST /v1/shipping/quotes` plans the consignment
      from the product's shipping specification, its packed dimensions and
      the weight recorded there, and never reads `weight_kg`. The field is
      published for information, so do not pre-estimate freight from it: an
      estimate built that way will disagree with our quote, and you would be
      chasing the difference in the wrong place. Ask for a quote and read the
      rate.
    * **Availability is derived.** Because the kit holds no stock of its own,
      `/v1/inventory` works its quantity out from the components, as below.

    ## How many kits can you sell

    Within one metro, for one kit:

    ```
    available = floor( min over components of ( component_available / quantity ) )
    ```

    A component with no inventory row in that metro contributes zero, which
    makes the kit zero there. Absence means "cannot ship", never "unknown".
    The division is integer and floored: three panels against a kit that
    needs two of them is one kit, not one and a half.

    The national `total` is the **sum of the per metro figures**, not a
    minimum taken against national component totals. This is the number
    partners most often calculate differently, so it is worth being explicit
    about why ours is the smaller one. A minimum against national totals
    treats a battery sitting in Perth as though it could complete a kit in
    Sydney. It cannot: a kit ships from a single metro, so the only quantity
    we can promise is the count of complete kits each metro can assemble on
    its own, added up. If your own arithmetic gives a larger figure than
    `total`, splitting the components across states is why.

    ## Kits you will not see

    A kit that cannot be assembled, or cannot be weighed, is absent from the
    catalogue and from the inventory feed entirely, rather than listed at
    zero. That covers a kit with a component that is inactive or no longer
    exists, a kit with no components recorded at all, a kit where a
    component's quantity is not a positive number, and a kit whose weight
    cannot be resolved, meaning it has no weight of its own and none can be
    worked out from its components. The last one is a safeguard against
    publishing a bundle we cannot describe accurately. A kit vanishing from
    your catalogue sync therefore means it is no longer sellable, exactly as
    it would for any other withdrawn SKU.

    Being listed means the kit can be ordered. It does not guarantee an
    automatic freight rate, because publication and quoting are separate
    tests: publication needs a resolvable weight, while quoting needs the
    full set of packed dimensions as well. In practice every kit publishing
    today carries complete dimensions, so the gap is empty. What you will
    meet instead is a kit that quotes as `manual_quote_required`, most often
    because one unit is heavier than a standard pallet movement allows. That
    is not an error and not worth retrying: it means a person will price the
    freight. Handle it the same way you handle it for any oversize product.

    ## Ordering a kit

    Order a kit as a single line carrying the kit's SKU, the kit's
    `unit_price` and the number of kits wanted. The line is validated
    against the kit's own derived availability, not against each component
    separately. Do not expand a kit into one line per component: that is a
    different order, priced at component prices and quoted as a different
    consignment. Breaking the kit into its parts for picking happens on the
    Solar Juice side after the order is accepted, and nothing about it is
    visible through this API.

    # Webhooks

    There are none in stage 1. Solar Juice does not call your systems, and
    there is nothing to register or verify. Polling is the intended pattern:
    `GET /v1/orders?updated_since=` for order status, `X-Price-List-Version`
    for prices, and `GET /v1/inventory?updated_since=` for stock.

    # Idempotency

    `POST /v1/orders` is idempotent on `client_reference`, and on nothing
    else. Each channel has a unique `client_reference` per order (for example
    your purchase order number). The first submission returns `202` with the
    new order. Submitting the same `client_reference` again with the same
    body returns `200` with the order that already exists; submitting it with
    a different body returns `409 IDEMPOTENCY_CONFLICT`. The comparison is on
    the meaningful content of the request (reference, version, quote, rate,
    delivery address, lines and note), normalised for case and whitespace, so
    a retry that differs only in formatting is still a replay.

    Sandbox and live have separate `client_reference` namespaces: the same
    reference used with a `sj_test_` key and a `sj_live_` key is two orders,
    not a conflict.

    An `Idempotency-Key` header is accepted for compatibility with generic
    HTTP clients and is then ignored. It is not stored, not compared and not
    returned, so it cannot be used to reconcile anything. Use
    `client_reference`.

    `POST /v1/shipping/quotes` produces a new `quote_id` for a cart the API
    has not seen. It is not idempotent in the strict sense, but it is cached:
    an identical normalised cart, destination, origin and channel within the
    quote's lifetime is served the same `quote_id` again, as long as at least
    five minutes of its validity remain. In practice a repeated quote for an
    unchanged cart returns the same id for up to about 25 minutes, and then a
    fresh one. Never rely on either behaviour; read `quote_id` and
    `expires_at` from the response you have.

    # Versioning and deprecation

    The API is versioned in the path (`/v1`). Within a version, Solar Juice may
    add new fields to responses, add new optional request fields, add new
    endpoints and add new values to enumerations that are documented as open
    (order status, error code). Clients must ignore fields they do not know.

    Breaking changes ship as a new path version. When a version is deprecated
    Solar Juice gives at least 12 months notice. During that period every
    response from the deprecated version carries a `Deprecation` header and a
    `Sunset` header (RFC 8594) with the date after which it will stop
    responding. Deprecation notices are also sent to the technical contact
    registered for each channel.

    # Money and timestamps

    * Money is a decimal string with exactly two decimal places, in AUD and
      exclusive of GST unless the field name says otherwise: `"1234.50"`.
      Never a float. `gst` and `total` on an order are the exceptions: `gst`
      is the GST amount and `total` is inclusive of GST.
    * Percentages are JSON numbers, not strings, with at most two decimal
      places: `percent_off` for 15 percent is `15`, and for 12.5 percent is
      `12.5`. Money is a string and percentages are numbers; the two do not
      follow the same rule.
    * Quantities are integers.
    * Timestamps are UTC ISO 8601 with a `Z` suffix: `2026-09-02T04:10:11Z`.
    * SKUs are Solar Juice part numbers, case sensitive, for example
      `GW-5000-DNS-30`.
    * Metro names are title case: `Sydney`, `Melbourne`, `Brisbane`, `Perth`,
      `Adelaide`, `Townsville`.

    # Caching

    Priced responses are per channel and are served with
    `Cache-Control: private, no-store`: the catalogue, specials, shipping
    quotes and orders. `GET /v1/orders/{id}` returns a weak `ETag` of the form
    `W/"a1b2c3d4e5f60718"` and honours `If-None-Match` with a `304`; compare
    it byte for byte and send back exactly what you received, weak prefix
    included. There is no edge cache: every request reaches the API and
    counts against the rate limit.

    # Errors

    Every error response, whatever the status code, has the same body:

    ```json
    {
      "error": {
        "code": "PRICE_CHANGED",
        "message": "Human readable explanation",
        "details": [],
        "request_id": "req_01j6zk3m5x8qw2r7y9v4b1n0pd"
      }
    }
    ```

    `details` is a list of free-form objects whose keys depend on the code.
    Field problems carry `field` and `reason` (not `message`); `PRICE_CHANGED`
    and `IDEMPOTENCY_CONFLICT` use their own keys again. Read `code` and
    `message` for behaviour and treat `details` as diagnostic: new keys may
    be added at any time.

    | Code | HTTP | When |
    |---|---|---|
    | `UNAUTHORIZED` | 401 | Missing, malformed, revoked or wrong-environment key |
    | `FORBIDDEN` | 403 | Key lacks the scope for this operation, or the channel is suspended |
    | `NOT_FOUND` | 404 | No such SKU, order or route for this channel |
    | `VALIDATION_FAILED` | 422 | Request body or query does not validate; `details` lists each problem |
    | `RATE_LIMITED` | 429 | Per key allowance exhausted; honour `Retry-After` |
    | `PRICE_CHANGED` | 409 | Order line prices or `price_list_version` no longer match; `details` carries current values |
    | `IDEMPOTENCY_CONFLICT` | 409 | Same `client_reference` submitted with a different body |
    | `QUOTE_UNAVAILABLE` | 503 | Freight engine temporarily unreachable; honour `Retry-After` |
    | `STALE_DATA` | 503 | The catalogue or inventory read model is not loaded on the instance that answered; honour `Retry-After` and retry |
    | `INTERNAL` | 500 | Unexpected failure; retry with backoff and report the `request_id` if it persists |

    `STALE_DATA` means one thing only: the instance that answered has no
    catalogue or inventory document loaded, usually for a few seconds after a
    deployment or a publish. It is not a staleness threshold and it is not a
    trading halt. The separate `stale` flag on catalogue and inventory
    responses is the age signal, and orders are accepted normally while it is
    `true`: treat stale figures as indicative, not as a reason to stop.

  termsOfService: https://dev.solarjuice.com.au/terms
  contact:
    name: Solar Juice Developer Program
    url: https://dev.solarjuice.com.au
    email: developers@solarjuice.com.au
  license:
    name: Solar Juice Partner API Terms
    url: https://dev.solarjuice.com.au/terms

servers:
  - url: https://api.solarjuice.com.au
    description: >-
      The API. Accepts both sj_live_ and sj_test_ keys; a test key puts the
      request in sandbox mode, where orders are stored flagged and never reach
      operations.

security:
  - bearerAuth: []

tags:
  - name: Catalogue
    description: Products available to this channel with the channel's own price, kits included. A kit has `is_kit` true and carries a `components` list, and its price is its own rather than a total of its parts.
  - name: Inventory
    description: Sellable quantity per metro, identical to what the Solar Outlet storefront sees. A kit holds no stock of its own, so its quantity is derived from its components. The API does not reserve stock.
  - name: Specials
    description: Time boxed price reductions granted to this channel. Granted specials are already reflected in catalogue prices.
  - name: Shipping
    description: Freight quotes produced by the same engine as the Solar Outlet checkout. A quote is required to place an order.
  - name: Orders
    description: Orders placed against this channel's trade account. Validation and acceptance are synchronous; poll the order for fulfilment status.
  - name: Health
    description: Unauthenticated liveness check.

paths:
  /v1/catalogue:
    get:
      tags: [Catalogue]
      operationId: listCatalogue
      summary: List catalogue products with this channel's prices
      description: |
        Returns every active product this channel can buy, with the channel's
        current price per SKU. `list_price` is the public list price (the
        compare-at figure) and `price` is what this channel pays; when a granted
        special is the reason `price` is lower, `special` carries its id.

        The response header `X-Price-List-Version` (also present as
        `price_list_version` in the body) identifies the price list the page was
        priced from. Send it back on `POST /v1/orders`; if the list has changed in
        between, the order is refused with `409 PRICE_CHANGED` and you should
        refresh.

        It is also the only reliable change signal for prices. `updated_at`
        moves when the product record changes; it does not move when a special
        starts or ends, or when your channel discount or a per SKU override
        changes, all of which change `price`. So watch
        `X-Price-List-Version`, and when it differs from the one you hold,
        re-read the whole catalogue rather than an `updated_since` slice.

        Kits are included in this listing when kit delivery is enabled on your
        channel, which is off by default and arranged by your account manager.
        With it off, no kit appears here at all and there is no flag saying so;
        `is_kit` is still on every product you can see and is simply always
        `false`. If you expect kits and see none, ask your account manager
        rather than looking for a fault in your client.

        A kit is a bundle sold under one SKU that holds no stock of its own.
        It carries `is_kit` true and a `components` list of `{sku, quantity}`,
        its `price` is its own rather than a total of its parts, its
        `weight_kg` is likewise its own rather than a total, and its quantity
        in `/v1/inventory` is derived from its components. As on any other
        product, `weight_kg` is published for information and is not what a
        freight quote is priced from.
        Ordinary products carry `is_kit` false and no `components` key at all,
        so branch on `is_kit` rather than on the SKU prefix. The Kits section
        of the introduction has the full rules.

        A kit that cannot currently be assembled, because a component is
        inactive or missing, or whose weight cannot be resolved, is left out
        of this listing rather than returned with zero stock. Treat its
        disappearance from a sync as a withdrawal.

        Supports cursor pagination, `updated_since` and the `brand` and
        `category` filters; see the introduction.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/updated_since'
        - name: brand
          in: query
          description: |
            Return only products with this brand. The whole value must match,
            but case is ignored, so `goodwe` and `GoodWe` are the same filter.
          required: false
          schema:
            type: string
            examples: [GoodWe]
        - name: category
          in: query
          description: |
            Return only products in this category, for example `Inverter`,
            `Panel`, `Battery` or `Rail`. Matched like `brand`: whole value,
            case ignored.
          required: false
          schema:
            type: string
            examples: [Inverter]
      responses:
        '200':
          description: A page of catalogue products.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Price-List-Version:
              $ref: '#/components/headers/X-Price-List-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueList'
              examples:
                firstPage:
                  summary: First page of two products, more pages follow
                  value:
                    as_of: '2026-09-02T04:10:11Z'
                    price_list_version: plv_9f3a2c1d84b6e05
                    stale: false
                    items:
                      - sku: GW-5000-DNS-30
                        title: GoodWe 5kW Single Phase Hybrid Inverter
                        brand: GoodWe
                        category: Inverter
                        list_price: '1234.50'
                        price: '1110.99'
                        special: null
                        weight_kg: '18.50'
                        is_kit: false
                        images:
                          - https://cdn.shopify.com/s/files/1/0000/0000/products/gw-5000-dns-30.jpg
                        updated_at: '2026-09-02T04:10:11Z'
