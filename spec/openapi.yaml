  /v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Place an order
      description: |
        Places an order against this channel's trade account. The end customer's
        name, phone and address are delivery details only; they are never used
        to create or match a customer record.

        ## What is validated synchronously

        1. Every `sku` exists and is active in this channel's catalogue.
        2. Every `quantity` is between 1 and 9999.
        3. Every `unit_price` equals the channel's current price for that SKU
           **and** `price_list_version` equals the current version. Otherwise
           `409 PRICE_CHANGED` is returned with the current values in
           `details`; refresh the catalogue and resubmit.
        4. `quote_id` is valid, unexpired, was issued for the same lines and
           destination, and `rate_service_code` is one of its rates. Otherwise
           `422 VALIDATION_FAILED`.
        5. `client_reference` has not been used by this channel with a
           different body, otherwise `409 IDEMPOTENCY_CONFLICT`. The same body
           returns the original receipt.

        Totals are computed server side from the current price list and the
        chosen rate. The response is authoritative; do not trust client side
        arithmetic.

        ## What happens next

        The order is returned with status `received` and a `202` because
        acceptance is asynchronous. It normally moves to `accepted` within
        seconds. Account level checks (credit hold, unapproved account) run in
        the back office and surface as `on_hold` or `rejected`. Poll
        `GET /v1/orders/{id}` (using `If-None-Match`) or
        `GET /v1/orders?updated_since=` to track it. The full state machine is
        documented on the `Order` schema.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            examples:
              standard:
                summary: A two line order using a priced quote
                value:
                  client_reference: PO-88213
                  price_list_version: '2026-09-02T04:00:00Z'
                  quote_id: qte_01J6ZK3M5X8QW2R7Y9V4B1N0PD
                  rate_service_code: ALLIED-GENERAL
                  delivery:
                    name: Jane Citizen
                    company: null
                    phone: '+61400000000'
                    email: jane@example.com
                    address1: 12 Example Street
                    address2: null
                    suburb: Parramatta
                    postcode: '2150'
                    state: NSW
                    country: AU
                    instructions: Leave at side gate if no answer
                  lines:
                    - sku: GW-5000-DNS-30
                      quantity: 1
                      unit_price: '1110.99'
                    - sku: JKM-440N-54HL4-V
                      quantity: 12
                      unit_price: '119.00'
                  partner_note: Installer job 4471
      responses:
        '202':
          description: |
            The order has been received and recorded. Its status is `received`
            until asynchronous acceptance completes. Resubmitting the same
            `client_reference` with the same body returns this same receipt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              description: URL of the created order.
              schema:
                type: string
                examples: [/v1/orders/ord_01J6ZK3M5X8QW2R7Y9V4B1N0PD]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                received:
                  summary: Receipt immediately after submission
                  value:
                    id: ord_01J6ZK3M5X8QW2R7Y9V4B1N0PD
                    channel_id: ch_01J6ZK3M5X8QW2R7Y9V4B1N0PD
                    client_reference: PO-88213
                    status: received
                    price_list_version: '2026-09-02T04:00:00Z'
                    currency: AUD
                    subtotal: '2538.99'
                    shipping_total: '123.45'
                    gst: '266.24'
                    total: '2928.68'
                    quote_id: qte_01J6ZK3M5X8QW2R7Y9V4B1N0PD
                    rate_service_code: ALLIED-GENERAL
                    delivery:
                      name: Jane Citizen
                      company: null
                      phone: '+61400000000'
                      email: jane@example.com
                      address1: 12 Example Street
                      address2: null
                      suburb: Parramatta
                      postcode: '2150'
                      state: NSW
                      country: AU
                      instructions: Leave at side gate if no answer
                    lines:
                      - sku: GW-5000-DNS-30
                        title: GoodWe 5kW Single Phase Hybrid Inverter
                        quantity: 1
                        unit_price: '1110.99'
                        line_total: '1110.99'
                        special_id: null
                      - sku: JKM-440N-54HL4-V
