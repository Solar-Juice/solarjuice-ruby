    get:
      tags: [Specials]
      operationId: listSpecials
      summary: List specials granted to this channel
      description: |
        Returns active and upcoming specials granted to this channel, one row
        per SKU, oldest window first. A campaign covering several SKUs appears
        as several rows sharing the same `name`.

        `kind` says which sort of special it is: `price` carries an absolute
        `special_price` and a null `percent_off`, `percent` carries a
        `percent_off` and a null `special_price`. `effective_price` is the
        resulting price for this channel, and is `null` when the SKU is not an
        active catalogue product for you: there is then no list price to
        resolve a percentage against. `active` is `true` for the rows whose
        window includes the current instant, and `false` for rows that have
        not started yet.

        A special whose window has closed is not returned at all, including
        under `updated_since`. Reconcile removals by treating the response as
        the complete set of your live and upcoming specials: anything you hold
        that is not in a full walk has ended.

        Granted specials are already folded into `price` on the catalogue, so
        this endpoint is for display (badges, countdowns, campaign pages) and
        for knowing when a price will change. Pass `active=true` to restrict
        the list to specials live right now, and `sku` to restrict to one
        product.

        Supports cursor pagination and `updated_since`; see the introduction.
