  /v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order before it reaches operations
      description: |
        Cancels one of this channel's own orders. Requires the `orders:write`
        scope.

        A partner may cancel while the order is `received`, `accepted` or
        `on_hold`, which in practice means before operations key it into the
        fulfilment system. Once it is `processing`, `dispatched`, `cancelled`
        or `rejected` the API refuses and the cancellation has to go through
        your account manager. There is no un-cancel: `cancelled` is terminal.

        The body is optional. Send `{"note": "..."}` to record why; with no
        body the event note is recorded as `cancelled by partner`.

        The response is the order at its new status, with the cancellation
        appended to `events`. It is safe to call twice only in the sense that
        the second call is refused with `422`, not that it does anything: check
        `status` on the order you already hold before calling.
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancelRequest'
            examples:
              withNote:
                summary: Cancel with a reason
                value:
                  note: Customer changed the panel selection
      responses:
        '200':
          description: The order, now `cancelled`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The order moved while this request was in flight, so the
            cancellation was not applied. `details` carries the status the
            order actually holds. Re-read the order and decide again.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                raced:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: order status changed while this request was in flight; re-read the order and retry
                      details:
                        - status: processing
                          expected: accepted
                          requested: cancelled
                      request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
        '422':
          description: |
            The order is past the point a partner can cancel it, or the note
            is not valid JSON object content.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tooLate:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: order is already processing and cannot be cancelled by the partner
                      details: []
                      request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      description: |
        Unauthenticated. Returns `200 {"status": "ok"}` when the API process is
        up and serving. It does not report the freshness of catalogue or
        inventory data; use the `stale` flag and `as_of` on inventory responses
        for that.

        This operation sits outside the authenticated surface, so unlike every
        other operation it carries no `RateLimit-*` headers and never answers
        `429`. It is a liveness probe, not a service: do not poll it in place
        of the endpoint you actually want.
      security: []
      responses:
        '200':
          description: The service is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value:
                    status: ok
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sj_live_<keyid>_<secret> or sj_test_<keyid>_<secret>
      description: |
        Partner API key issued by Solar Juice. Format
        `sj_<env>_<keyid>_<32 hex secret>`. Both `sj_live_` and `sj_test_` keys
        are accepted on the same host; a `sj_test_` key puts the request in
        sandbox mode. Send as `Authorization: Bearer <full key>`. Keys carry
        scopes; an operation outside the key's scopes returns `403 FORBIDDEN`.

  parameters:
    limit:
      name: limit
      in: query
      description: |
        Page size. Default 100, maximum 500. A larger value is clamped to 500
        rather than refused; a value that is not a positive integer is `400`.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`. Omit for the first page.
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    updated_since:
      name: updated_since
      in: query
      description: |
        Return only items changed at or after this UTC instant. Safe to pass the
        `as_of` value from your previous response; see the introduction.
      required: false
      schema:
        $ref: '#/components/schemas/Timestamp'
    sku:
      name: sku
      in: path
      description: Solar Juice part number. Case sensitive.
      required: true
      schema:
        $ref: '#/components/schemas/Sku'
    orderId:
      name: id
      in: path
      description: Order id as returned by `POST /v1/orders`.
      required: true
      schema:
        $ref: '#/components/schemas/OrderId'
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from a previous response. When it still matches, the API returns `304` with no body.
      required: false
      schema:
        type: string
        examples: ['W/"a1b2c3d4e5f60718"']
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Accepted and ignored. It is here so that a generic HTTP client that
        sets the header on every unsafe request is not rejected; the API does
        not read it, store it, compare it or return it. `client_reference` in
        the body is the only idempotency key, and sending this header instead
        of one will not deduplicate anything.
      deprecated: true
      required: false
      schema:
        type: string
        maxLength: 255
        examples: [3f2c9b7e-1c4a-4a2e-9a1f-0b7d5e6c8a90]

  headers:
    X-Request-Id:
      description: Unique id for this request. Quote it in support requests. Repeated as `request_id` in error bodies.
      schema:
        $ref: '#/components/schemas/RequestId'
    RateLimit-Limit:
      description: Requests allowed per one minute sliding window for this key.
      schema:
        type: integer
        minimum: 0
        examples: [600]
    RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
        examples: [597]
    RateLimit-Reset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        minimum: 0
        examples: [42]
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        examples: [30]
    X-Price-List-Version:
      description: |
        Opaque version of the price list the response was priced from. Submit
        it as `price_list_version` on orders, and watch it for price changes:
        it is the only signal that catches a price moving because a special
        started or a discount changed, neither of which touches `updated_at`.
      schema:
        $ref: '#/components/schemas/PriceListVersion'
    X-Inventory-As-Of:
      description: Freshest source timestamp behind the inventory figures in the response.
      schema:
        $ref: '#/components/schemas/Timestamp'
    ETag:
      description: |
        Weak entity tag for the order representation, derived from its id and
        `updated_at`. Send it back verbatim in `If-None-Match`, `W/` prefix
        included.
      schema:
        type: string
        examples: ['W/"a1b2c3d4e5f60718"']

  responses:
    Unauthorized:
      description: Missing, malformed, revoked or wrong environment API key.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: api key is missing, invalid or revoked
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    Forbidden:
      description: The key does not have the scope for this operation, or the channel is suspended.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: this key does not have the orders:write scope
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    NotFound:
      description: No such resource for this channel.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: 'no such sku: GW-5000-DNS-99'
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    ValidationFailed:
      description: The request did not validate. `details` lists every problem found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            badQuantity:
              summary: Quantity out of range, and a duplicated SKU
              value:
                error:
                  code: VALIDATION_FAILED
                  message: order request is invalid
                  details:
                    - field: lines[1].quantity
                      reason: must be 1..9999
                    - field: lines[2].sku
                      reason: duplicate sku; merge quantities into one line
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
            badAddress:
              summary: The postcode and state do not check out
              value:
                error:
                  code: VALIDATION_FAILED
                  message: order request is invalid
                  details:
                    - field: delivery.postcode
                      reason: must be 4 digits
                    - field: delivery.state
                      reason: must be an Australian state or territory code
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
            quoteMismatch:
              summary: The quote was computed for a different cart
              value:
                error:
                  code: VALIDATION_FAILED
                  message: quote was computed for different lines or destination; request a new quote
                  details:
                    - field: quote_id
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
            unorderableSku:
              summary: A line names a SKU this channel cannot buy
              value:
                error:
                  code: VALIDATION_FAILED
                  message: one or more skus are not orderable
                  details:
                    - sku: GW-5000-DNS-99
                      reason: unknown or inactive sku
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    BadRequest:
      description: |
        The request could not be read, or a query parameter could not be
        parsed. The code is `VALIDATION_FAILED` at status `400` rather than
        `422`, because nothing about the request was understood well enough to
        validate. This is what a malformed JSON body, a body that is not a
        single JSON value, a field of the wrong JSON type, an unknown field, a
        `limit` that is not a positive integer, a `cursor` the API did not
        issue and an unparsable `updated_since` all return.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unknownField:
              summary: A misspelled field is refused rather than ignored
              value:
                error:
                  code: VALIDATION_FAILED
                  message: unknown field "deliverry"
                  details:
                    - field: deliverry
                      reason: unknown field
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
            malformedJson:
              summary: The body is not JSON
              value:
                error:
                  code: VALIDATION_FAILED
                  message: malformed JSON at offset 42
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
            badCursor:
              summary: A cursor the API did not issue
              value:
                error:
                  code: VALIDATION_FAILED
                  message: cursor is not valid
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    PayloadTooLarge:
      description: |
        The request body is over the limit for this operation: 64 KiB on
        `POST /v1/orders`, 1 MiB elsewhere. An order of 200 lines with full
        delivery details is a few KiB, so this normally means a runaway
        client rather than a large order.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            tooLarge:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: request body exceeds 64 KiB
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    RateLimited:
      description: The key's allowance for the current window is exhausted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: rate limit exceeded
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    OrderConflict:
      description: |
        Either the prices submitted no longer match the channel's current price
        list (`PRICE_CHANGED`, refresh the catalogue and resubmit with the
        current `unit_price` values and `price_list_version` from `details`) or
        this `client_reference` was already used with a different body
        (`IDEMPOTENCY_CONFLICT`, choose a new reference or fetch the existing
        order).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            priceChanged:
              summary: The version is out of date and one line has moved
              value:
                error:
                  code: PRICE_CHANGED
                  message: prices or price list version have changed; refresh the catalogue and resubmit
                  details:
                    - price_list_version: plv_4c81ba09e7d2f6
                      current_price_list_version: plv_9f3a2c1d84b6e05
                    - sku: GW-5000-DNS-30
                      unit_price: '1110.99'
                      current_price: '1099.00'
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
            idempotencyConflict:
              summary: client_reference reused with a different body
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: client_reference was already used for a different order request
                  details:
                    - order_id: ord_01j6zk3m5x8qw2r7y9v4b1n0pd
                      client_reference: PO-88213
                      status: accepted
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    QuoteUnavailable:
      description: The freight engine is temporarily unreachable. Retry after the `Retry-After` delay.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            quoteUnavailable:
              value:
                error:
                  code: QUOTE_UNAVAILABLE
                  message: shipping quote is unavailable, retry shortly
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    StaleData:
      description: |
        The instance that answered has no catalogue or inventory document
        loaded, so it has nothing to serve this operation from. It is a
        transient condition, normally a few seconds after a deployment or a
        read model publish, not a data age threshold. Retry after the
        `Retry-After` delay.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            staleData:
              value:
                error:
                  code: STALE_DATA
                  message: catalogue read model is not loaded
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd
    Internal:
      description: Unexpected failure. Retry with backoff; report the `request_id` if it persists.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL
                  message: internal error
                  details: []
                  request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd

  schemas:
    # Primitives

    Money:
      type: string
      description: Decimal amount with exactly two decimal places, AUD, exclusive of GST unless the field name says otherwise. Never a float.
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      examples: ['1234.50']

    Percent:
      type: number
      description: |
        Percentage as a JSON number with at most two decimal places: `15` for
        15 percent, `12.5` for 12.5 percent. Money is a decimal string and
        percentages are numbers; the two do not follow the same rule.
      minimum: 0
      maximum: 100
      multipleOf: 0.01
      examples: [15]

    Timestamp:
      type: string
      format: date-time
      description: UTC ISO 8601 with a `Z` suffix.
      examples: ['2026-09-02T04:10:11Z']

    PriceListVersion:
      type: string
      description: |
        Identifies the channel's current price list. It is an opaque token,
        `plv_` followed by a short hexadecimal digest, derived from the
        resolved price of every SKU in the channel's catalogue. It changes
        whenever any of those prices changes, whatever the cause: a base
        price edit, a change to the channel discount, a per SKU override, or
        a special starting or ending.

        It is not a timestamp and carries no ordering. Compare two values for
        equality only; a difference means re-read the catalogue, it does not
        mean one is newer. The format may change without notice, so store it
        as an opaque string.
      pattern: '^plv_[0-9a-f]{1,16}$'
      examples: [plv_9f3a2c1d84b6e05]

    Sku:
      type: string
      description: Solar Juice part number. Case sensitive.
      minLength: 1
      maxLength: 64
      examples: [GW-5000-DNS-30]

    Cursor:
      type: string
      description: Opaque pagination cursor. Do not construct or decode.
      examples: [eyJ1cGRhdGVkX2F0IjoiMjAyNi0wOS0wMVQyMjozMDowMFoiLCJza3UiOiJKS00tNDQwTi01NEhMNC1WIn0]

    RequestId:
      type: string
      description: Request id, `req_` followed by a 26 character ULID.
      pattern: '^req_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [req_01j6zk3m5x8qw2r7y9v4b1n0pd]

    OrderId:
      type: string
      description: Order id, `ord_` followed by a 26 character ULID.
      pattern: '^ord_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [ord_01j6zk3m5x8qw2r7y9v4b1n0pd]

    ChannelId:
      type: string
      description: Channel id, `ch_` followed by a 26 character ULID. Identifies your sales channel.
      pattern: '^ch_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [ch_01j6zk3m5x8qw2r7y9v4b1n0pd]

    SpecialId:
      type: string
      description: Special id, `spc_` followed by a 26 character ULID.
      pattern: '^spc_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [spc_01j6zk3m5x8qw2r7y9v4b1n0pd]

    QuoteId:
      type: string
      description: Shipping quote id as returned by `POST /v1/shipping/quotes`. Opaque.
      minLength: 1
      maxLength: 64
      examples: [qt_01j6zk3m5x8qw2r7y9v4b1n0pd]

    Metro:
      type: string
      description: Metro name in title case. The set may grow; treat unknown values as new metros.
      examples: [Sydney, Melbourne, Brisbane, Perth, Adelaide, Townsville]

    AustralianState:
      type: string
      description: Australian state or territory abbreviation.
      enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT]

    # Errors

    ErrorCode:
      type: string
      description: |
        Machine readable error code. Open enumeration; new codes may be added
        with notice. Clients should fall back on the HTTP status for unknown
        codes.

        * `UNAUTHORIZED` (401): missing, malformed, revoked or wrong environment key.
        * `FORBIDDEN` (403): key lacks the scope, or the channel is suspended.
        * `NOT_FOUND` (404): no such SKU, order or route for this channel.
        * `VALIDATION_FAILED` (422): request does not validate; see `details`.
        * `RATE_LIMITED` (429): allowance exhausted; honour `Retry-After`.
        * `PRICE_CHANGED` (409): order prices or version out of date; current values in `details`.
        * `IDEMPOTENCY_CONFLICT` (409): `client_reference` reused with a different body.
        * `QUOTE_UNAVAILABLE` (503): freight engine unreachable; honour `Retry-After`.
        * `STALE_DATA` (503): backing data too old to serve this operation safely.
        * `INTERNAL` (500): unexpected failure.
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - PRICE_CHANGED
        - IDEMPOTENCY_CONFLICT
        - QUOTE_UNAVAILABLE
        - STALE_DATA
        - INTERNAL

    ErrorDetail:
      type: object
      description: |
        One problem with the request. The keys depend on the error code, so
        treat a detail as a diagnostic bag rather than a fixed shape, and
        never branch on it where `code` would do.

        * Field problems (`VALIDATION_FAILED`) carry `field`, a JSON path
          into the request body or a query parameter name, and `reason`, a
          short explanation. There is no `message` key on a detail.
        * `PRICE_CHANGED` returns one object carrying `price_list_version`
          and `current_price_list_version`, followed by one object per line
          that moved, carrying `sku`, `unit_price` (what you sent) and
          `current_price`.
        * `IDEMPOTENCY_CONFLICT` returns one object carrying `order_id`,
          `client_reference` and `status` for the order that already exists.
        * An unorderable SKU returns `sku` and `reason`.

        New keys may be added at any time.
      properties:
        field:
          type: string
          description: JSON path into the request body, or a query or header name.
          examples: ['lines[0].unit_price']
        reason:
          type: string
          description: Short explanation of this detail.
          examples: [must be 1..9999]
        sku:
          $ref: '#/components/schemas/Sku'
      additionalProperties: true

    Error:
      type: object
      required: [code, message, details, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human readable explanation. Do not parse; use `code`.
          examples: [One or more prices no longer match the current price list.]
        details:
          type: array
          description: Zero or more specific problems. Empty when there is nothing to add.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          $ref: '#/components/schemas/RequestId'

    ErrorEnvelope:
      type: object
      description: The body of every error response, whatever the status code.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
      examples:
        - error:
            code: NOT_FOUND
            message: 'no such sku: GW-5000-DNS-99'
            details: []
            request_id: req_01j6zk3m5x8qw2r7y9v4b1n0pd

    # Catalogue

    KitComponent:
      type: object
      description: |
        One product a kit is assembled from, and how many of it a single kit
        contains.
      required: [sku, quantity]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
          description: |
            The component's own SKU. It is an ordinary catalogue SKU, so it
            can be read from `/v1/catalogue/{sku}` and bought on its own, at
            its own price.
        quantity:
          type: integer
          minimum: 1
          description: |
            How many of this component one kit contains. It is the divisor
            when the kit's availability is derived from the component's.
          examples: [3]

    CatalogueProduct:
      type: object
      description: |
        A product priced for this channel. It may be an ordinary product or
        a kit; `is_kit` says which, and a kit carries `components` as well.
      required: [sku, title, brand, category, list_price, price, special, weight_kg, is_kit, images, updated_at]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        title:
          type: string
          description: Product title as shown on Solar Outlet.
          examples: [GoodWe 5kW Single Phase Hybrid Inverter]
        brand:
          type: string
          examples: [GoodWe]
        category:
          type: string
          description: Product category. `Rail`, `Panel` and `Battery` are used by the freight engine; other values are the product's category string.
          examples: [Inverter]
        list_price:
          $ref: '#/components/schemas/Money'
          description: |
            Public list price, ex GST: the compare-at figure. It is normally
            at or above `price`, but nothing enforces that, so a channel
            override above list will show `price` higher than `list_price`.
            Do not derive a discount badge without checking.
        price:
          $ref: '#/components/schemas/Money'
          description: |
            This channel's price, ex GST, after channel discount, per SKU
            override and any granted special. Submit as `unit_price` on
            orders.

            On a kit this is the kit's own price, set against the kit by
            hand. It is not derived from the components and adding them up
            will not reproduce it, so never substitute a computed total.
        special:
          oneOf:
            - $ref: '#/components/schemas/SpecialId'
            - type: 'null'
          description: Id of the granted special that produced `price`, or `null` when no special applies.
        weight_kg:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            Unit weight in kilograms as a decimal string, or `null` when the
            product has no weight recorded. A product with no weight still
            quotes freight, from its shipping specification.

            This field is informational. Freight is not priced from it, for a
            kit or for anything else: `POST /v1/shipping/quotes` plans every
            consignment from the product's shipping specification and never
            reads `weight_kg`. Do not estimate freight from it, because the
            two figures are allowed to differ and yours would be the one that
            is wrong.

            On a kit this is the kit's own weight, recorded against the kit in
            the same way as for any other product. A weight worked out from
            the components is only the fallback, used when the kit itself has
            none recorded, so do not expect the two to agree and do not
            compute one from `components` yourself.

            It is never `null` on a kit. That holds by construction rather
            than by convention: a kit whose weight cannot be resolved either
            way is withheld from the catalogue altogether.
          examples: ['18.50']
        is_kit:
          type: boolean
          description: |
            True when this product is a kit: a bundle sold under one SKU
            that holds no stock of its own and is assembled from the
            products listed in `components`.

            Present on every catalogue product, and `false` on an ordinary
            one, so branch on this field rather than on the SKU prefix. The
            `Kit-` naming is a convention on our side and carries no
            guarantee.

            A kit differs in three ways worth knowing before you sell one:
            `price` is the kit's own figure and not a total of its parts,
            `weight_kg` is likewise the kit's own rather than a total, and its
            quantity in `/v1/inventory` is derived from the components rather
            than counted. Freight is quoted the same way as for any other
            product, from the shipping specification rather than from
            `weight_kg`. A kit that cannot be assembled, or whose weight
            cannot be resolved, is absent from the catalogue rather than
            listed at zero.
          examples: [false]
        components:
          type: array
          description: |
            The products this kit is assembled from, one entry each. Present
            only when `is_kit` is true, and omitted entirely rather than
            sent empty on an ordinary product.

            The list is informational, for showing a customer what is in the
            box. It is not enough to reprice or reweigh the kit from: the
            kit's `price` and `weight_kg` are its own and neither is derived
            from what you see here. Order the kit as its own SKU at its own
            `price`; sending one order line per component is a different
            order at component prices.
          minItems: 1
          items:
            $ref: '#/components/schemas/KitComponent'
        images:
          type: array
          description: Public image URLs, primary first. May be empty.
          items:
            type: string
            format: uri
            examples: [https://cdn.shopify.com/s/files/1/0000/0000/products/gw-5000-dns-30.jpg]
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When this product, or its price for this channel, last changed.

    CatalogueList:
      type: object
      required: [as_of, price_list_version, stale, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When the catalogue document behind this page was published. Safe
            to pass as `updated_since` on the next sync, but see the note in
            the introduction: it will not pick up a price that moved because
            a special started or a channel discount changed.
        price_list_version:
          $ref: '#/components/schemas/PriceListVersion'
        stale:
          type: boolean
          description: |
            True when the catalogue document is older than the configured
            threshold. The prices are still served and orders are still
            accepted; it is a freshness signal, not a stop.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueProduct'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    # Inventory

    AvailableByMetro:
      type: object
      description: |
        Sellable quantity keyed by metro name. Metros with zero stock are
        omitted. For a kit these are derived figures rather than counted
        stock: see `InventoryItem.available`.
      additionalProperties:
        type: integer
        minimum: 0
      examples:
        - Sydney: 12
          Melbourne: 4

    InventoryItem:
      type: object
      required: [sku, available, total, updated_at]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        available:
          $ref: '#/components/schemas/AvailableByMetro'
          description: |
            Sellable quantity per metro. A kit holds no stock of its own, so
            for a kit SKU each figure is derived from its components:
            `floor(min over components of (component_available / quantity))`
            within that metro, with a component that has no row in the metro
            counting as zero.
        total:
          type: integer
          minimum: 0
          description: |
            Sum of `available` across all metros. For a kit that is the sum
            of the derived per metro figures, which is smaller than a minimum
            taken against national component totals whenever the components
            are spread across the country. The sum is the shippable number:
            a kit is assembled in one metro, so stock in Perth cannot
            complete a kit in Sydney.
          examples: [16]
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When this SKU's figures last changed.

    InventoryList:
      type: object
      required: [as_of, as_of_oldest, stale, locations, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: Freshest source timestamp in the feed.
        as_of_oldest:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Stalest source timestamp in the feed, or `null` when the feed does not report one.
        stale:
          type: boolean
          description: True when the feed is older than the configured threshold (default two hours).
        locations:
          type: array
          description: Every metro the service tracks, whether or not any item on this page has stock there.
          items:
            $ref: '#/components/schemas/Metro'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    InventoryItemDetail:
      type: object
      description: One SKU's inventory together with the feed timestamps.
      required: [as_of, as_of_oldest, stale, locations, sku, available, total, updated_at]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
        as_of_oldest:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        stale:
          type: boolean
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Metro'
        sku:
          $ref: '#/components/schemas/Sku'
        available:
          $ref: '#/components/schemas/AvailableByMetro'
        total:
          type: integer
          minimum: 0
          examples: [16]
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    # Specials

    Special:
      type: object
      description: |
        A time boxed price for one SKU granted to this channel. `kind` says
        which of `special_price` and `percent_off` is populated; the other is
        always `null`.
      required: [id, name, sku, kind, special_price, percent_off, effective_price, active, starts_at, ends_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/SpecialId'
        name:
          type: string
          description: Campaign name. Rows for several SKUs in one campaign share it.
          examples: [September panel clearance]
        sku:
          $ref: '#/components/schemas/Sku'
        kind:
          type: string
          description: |
            `price` for an absolute special price, `percent` for a percentage
            off the list price.
          enum: [price, percent]
        special_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Absolute special price ex GST when `kind` is `price`, otherwise `null`.
        percent_off:
          oneOf:
            - $ref: '#/components/schemas/Percent'
            - type: 'null'
          description: Percentage off list price when `kind` is `percent`, otherwise `null`.
        effective_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            The price this special produces for this channel, ex GST. `null`
            when the SKU is not an active product in your catalogue, because
            there is then no list price to apply the special to. A special can
            be granted for a SKU you cannot buy, so check for `null` before
            displaying a price.
        active:
          type: boolean
          description: |
            True when the current instant falls inside `[starts_at, ends_at]`.
            False for a special that has not started yet; specials whose
            window has closed are not returned at all.
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
          description: Inclusive end of the window.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When the special record itself last changed. It does not move when
            the window opens or closes, so it cannot be used to detect a
            special going live.

    SpecialsList:
      type: object
      required: [as_of, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: The instant the specials were evaluated for `active` and for window filtering.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Special'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    # Shipping

    Destination:
      type: object
      description: Where the goods are going. Australian addresses only.
      required: [suburb, postcode, state]
      properties:
        suburb:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Parramatta]
        postcode:
          type: string
          pattern: '^[0-9]{4}$'
          examples: ['2150']
        state:
          $ref: '#/components/schemas/AustralianState'
        country:
          type: string
          enum: [AU]
          default: AU
          description: Only `AU` is supported.
        address_type:
          type: string
          enum: [residential, business]
          default: residential
          description: Residential deliveries may attract a surcharge or different carrier; say which it is.

    QuoteLine:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
          description: |
            The SKU being shipped. For a kit this is the kit's SKU; do not
            list its components instead. The consignment is planned from this
            product's shipping specification, not from the `weight_kg` shown
            on the catalogue.
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
          examples: [12]

    ShippingQuoteRequest:
      type: object
      required: [destination, lines]
      properties:
        destination:
          $ref: '#/components/schemas/Destination'
        lines:
          type: array
          minItems: 1
          maxItems: 200
          description: Lines to ship. Duplicate SKUs are merged before quoting.
          items:
            $ref: '#/components/schemas/QuoteLine'
        origin_metro:
          $ref: '#/components/schemas/Metro'
          description: Optional. Force dispatch from this metro instead of the automatically chosen one.

    ShippingRate:
      type: object
      required: [service_code, service_name, carrier, total_price, currency, eta_days_min, eta_days_max, dangerous_goods]
      properties:
        service_code:
          type: string
          description: Stable code identifying the service. Submit as `rate_service_code` on the order.
          examples: [ALLIED-GENERAL]
        service_name:
          type: string
          description: Display name for the service.
          examples: [Road Freight]
        carrier:
          type: string
          examples: [Allied Express]
        total_price:
          $ref: '#/components/schemas/Money'
          description: Freight charge ex GST for the whole consignment, including any dangerous goods surcharge. Never `0.00`.
        currency:
          type: string
          enum: [AUD]
        eta_days_min:
          type: integer
          minimum: 0
          description: Earliest expected transit time in business days.
          examples: [2]
        eta_days_max:
          type: integer
          minimum: 0
          description: Latest expected transit time in business days.
          examples: [4]
        dangerous_goods:
          type: boolean
          description: True when the consignment is handled as dangerous goods (batteries) and the rate includes the DG surcharge.

    ShippingQuote:
      type: object
      description: |
        A freight quote. `quote_status` governs how to read it: `priced` means
        `rates` has at least one entry and the quote can be used on an order
        until `expires_at`; `manual_quote_required` means a person must quote
        (contact your account manager, quoting `quote_id`); `unavailable` means
        the destination cannot be serviced for these lines. `rates` is empty for
        the latter two.
      required: [quote_id, quote_status, expires_at, origin_metro, rates]
      properties:
        quote_id:
          $ref: '#/components/schemas/QuoteId'
        quote_status:
          type: string
          enum: [priced, manual_quote_required, unavailable]
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When the quote can no longer be used on an order. Always set,
            including on `manual_quote_required` and `unavailable` quotes:
            the id stays resolvable until then so support can look it up.
        origin_metro:
          $ref: '#/components/schemas/Metro'
          description: The metro the consignment was priced from.
        rates:
          type: array
          description: Available services, cheapest first. Empty unless `quote_status` is `priced`.
          items:
            $ref: '#/components/schemas/ShippingRate'

    # Orders

    OrderStatus:
      type: string
      description: |
        Partner facing order status. Open enumeration; see the `Order` schema
        for the state machine.
      enum: [received, accepted, on_hold, processing, dispatched, cancelled, rejected]

    DeliveryAddress:
      type: object
      description: |
        End customer delivery details. Used for the consignment only; never
        used to create or match a customer record.

        Every string field here is optional in the JSON sense: omit it and it
        is an empty string, never `null`. The API returns `""` for a field
        that was not supplied, so a client that checks for `null` will not
        find one. `name`, `address1`, `suburb`, `postcode` and `state` must be
        non empty; the rest may be left out.
      required: [name, address1, suburb, postcode, state]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Recipient name.
          examples: [Jane Citizen]
        company:
          type: string
          maxLength: 200
          examples: [Example Solar Pty Ltd]
        phone:
          type: string
          maxLength: 200
          description: |
            Contact number for the carrier. Not validated and not required,
            but a consignment without one is harder to deliver, so send it.
          examples: ['+61400000000']
        email:
          type: string
          maxLength: 200
          description: Optional. Receives carrier tracking notifications if provided. Not validated as an address.
          examples: [jane@example.com]
        address1:
          type: string
          minLength: 1
          maxLength: 200
          examples: [12 Example Street]
        address2:
          type: string
          maxLength: 200
          examples: [Unit 4]
        suburb:
          type: string
          minLength: 1
          maxLength: 200
          examples: [Parramatta]
        postcode:
          type: string
          pattern: '^[0-9]{4}$'
          description: Four digits. Checked the same way the shipping quote checks it.
          examples: ['2150']
        state:
          $ref: '#/components/schemas/AustralianState'
          description: Accepted in any case and returned upper case.
        country:
          type: string
          enum: [AU]
          default: AU
          description: Only `AU` is supported. Omitted, it defaults to `AU`.
        instructions:
          type: string
          maxLength: 1000
          description: Delivery instructions passed to the carrier.
          examples: [Leave at side gate if no answer]
        address_type:
          type: string
          enum: [residential, business]
          description: |
            Load bearing, because residential and business deliveries price
            differently. Omit it and the order adopts the address type the
            quote was priced for, which is what the stored order then shows.
            Send it and it must equal the quote's, or the order is refused
            with `422 VALIDATION_FAILED`: quoting a business address and then
            ordering to a residential one is a repricing, not a detail.
          examples: [business]

    OrderLineRequest:
      type: object
      required: [sku, quantity, unit_price]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
          description: |
            The SKU being ordered. For a kit this is the kit's SKU on a
            single line, validated against the kit's derived availability
            rather than against its components one by one.
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
          description: |
            How many units, or for a kit how many kits, not how many of
            anything inside it.
          examples: [12]
        unit_price:
          $ref: '#/components/schemas/Money'
          description: The `price` you were shown on the catalogue for this SKU, ex GST. Must equal the current channel price.

    OrderRequest:
      type: object
      required: [client_reference, price_list_version, quote_id, rate_service_code, delivery, lines]
      properties:
        client_reference:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Your unique reference for this order (purchase order number). The
            idempotency key, unique per channel per sandbox side.
          examples: [PO-88213]
        price_list_version:
          $ref: '#/components/schemas/PriceListVersion'
          description: The `X-Price-List-Version` you priced the cart from.
        quote_id:
          $ref: '#/components/schemas/QuoteId'
          description: A `priced`, unexpired quote for exactly these lines and this delivery address.
        rate_service_code:
          type: string
          maxLength: 200
          description: The `service_code` of the chosen rate on that quote.
          examples: [ALLIED-GENERAL]
        delivery:
          $ref: '#/components/schemas/DeliveryAddress'
        lines:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            One entry per SKU. SKUs must be distinct: two lines for the same
            SKU are refused with `422 VALIDATION_FAILED` rather than merged,
            so combine the quantities yourself. This differs from
            `POST /v1/shipping/quotes`, which does merge duplicates.
          items:
            $ref: '#/components/schemas/OrderLineRequest'
        partner_note:
          type: string
          maxLength: 1000
          description: Free text for Solar Juice operations. Not shown to the end customer. Empty string when not supplied, never `null`.
          examples: [Installer job 4471]

    OrderLine:
      type: object
      required: [sku, title, quantity, unit_price, line_total, special]
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        title:
          type: string
          description: Product title at the time the order was received.
          examples: [GoodWe 5kW Single Phase Hybrid Inverter]
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
        unit_price:
          $ref: '#/components/schemas/Money'
          description: Ex GST unit price charged.
        line_total:
          $ref: '#/components/schemas/Money'
          description: The `unit_price` multiplied by `quantity`, ex GST.
        special:
          oneOf:
            - $ref: '#/components/schemas/SpecialId'
            - type: 'null'
          description: |
            Id of the special that set `unit_price`, or `null`. The field is
            named `special`, matching the catalogue, not `special_id`.

    AppliedSpecial:
      type: object
      description: |
        A special that set the price of a line on this order. Recorded for
        redemption accounting. One entry per line that a special applied to;
        the quantity and the list price are on the matching entry in `lines`.
      required: [id, sku, unit_price]
      properties:
        id:
          $ref: '#/components/schemas/SpecialId'
        sku:
          $ref: '#/components/schemas/Sku'
        unit_price:
          $ref: '#/components/schemas/Money'
          description: The ex GST unit price the special produced.

    OrderEvent:
      type: object
      description: One status transition on the order.
      required: [status, note, actor, created_at]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        note:
          type: string
          description: |
            Free text from the actor, for example a back office reference or a
            hold reason. Empty string when there is none, never `null`.
          examples: [Keyed to NetSuite SO-104233]
        actor:
          type: string
          description: |
            Who made the transition, as a prefixed identifier rather than a
            fixed set of words: `system` for the API itself, `partner:<key
            id>` for something you did with your own key, and `ops:<operator>`
            for a Solar Juice operator. Match on the prefix before the colon,
            and expect new prefixes.
          examples: [partner:key_01j6zk3m5x8qw2r7y9v4b1n0pd, system, 'ops:alex@solarjuice.com.au']
        created_at:
          $ref: '#/components/schemas/Timestamp'

    Order:
      type: object
      description: |
        An order placed by this channel. Totals are computed server side and are
        authoritative: `subtotal` and `shipping_total` are ex GST, `gst` is the
        GST amount, `total` is inclusive of GST.

        ## Status state machine

        ```
        received --> accepted --> processing --> dispatched
            |            |
            |            +--> on_hold --> processing
            |                    |
            +--> rejected        +--> rejected
        any of received, accepted, on_hold --> cancelled
        ```

        | Status | Meaning |
        |---|---|
        | `received` | The first event on every order, recorded the instant the request arrived. An order is never returned in this status: acceptance happens in the same request, so it is already `accepted` by the time you see it. |
        | `accepted` | Passed every check the API can make and is queued for operations. This is the status a successful `POST /v1/orders` returns. |
        | `on_hold` | Held by the back office, typically an account check (credit hold, unapproved account) or stock allocation. `events[].note` says why. Resolves to `processing` or `rejected`. |
        | `processing` | Operations have keyed the order into the fulfilment system. The order can no longer be cancelled through the API. |
        | `dispatched` | Goods have left the warehouse. Stage 1 sets this manually; carrier tracking is a later addition. |
        | `cancelled` | Cancelled by operations or by the partner before `processing`. Terminal. |
        | `rejected` | Failed a check after receipt (for example account hold not cleared, stock not allocatable). `events[].note` says why. Terminal. |

        Every transition is appended to `events` with a timestamp, the actor and
        an optional note. `updated_at` moves with every transition, so
        `GET /v1/orders?updated_since=` picks up status changes. New statuses may
        be added with notice; treat the enumeration as open.
      required:
        - id
        - channel_id
        - client_reference
        - status
        - price_list_version
        - currency
        - subtotal
        - shipping_total
        - gst
        - total
        - quote_id
        - rate_service_code
        - delivery
        - lines
        - applied_specials
        - partner_note
        - sandbox
        - received_at
        - updated_at
        - events
      properties:
        id:
          $ref: '#/components/schemas/OrderId'
        channel_id:
          $ref: '#/components/schemas/ChannelId'
        api_key_id:
          type: string
          description: |
            The id of the key the order was placed with. Present on orders
            placed through the API and absent on the rare order created
            without a key, so treat it as optional.
          examples: [key_01j6zk3m5x8qw2r7y9v4b1n0pd]
        client_reference:
          type: string
          examples: [PO-88213]
        status:
          $ref: '#/components/schemas/OrderStatus'
        price_list_version:
          $ref: '#/components/schemas/PriceListVersion'
          description: The version the order was priced against.
        currency:
          type: string
          enum: [AUD]
        subtotal:
          $ref: '#/components/schemas/Money'
          description: Sum of `lines[].line_total`, ex GST.
        shipping_total:
          $ref: '#/components/schemas/Money'
          description: Freight charge for the chosen rate, ex GST.
        gst:
          $ref: '#/components/schemas/Money'
          description: GST amount on `subtotal` plus `shipping_total`.
        total:
          $ref: '#/components/schemas/Money'
          description: Sum of `subtotal`, `shipping_total` and `gst`. Inclusive of GST.
        quote_id:
          $ref: '#/components/schemas/QuoteId'
        rate_service_code:
          type: string
          examples: [ALLIED-GENERAL]
        delivery:
          $ref: '#/components/schemas/DeliveryAddress'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        applied_specials:
          type: array
          items:
            $ref: '#/components/schemas/AppliedSpecial'
        partner_note:
          type: string
          description: Empty string when none was supplied, never `null`.
        sandbox:
          type: boolean
          description: True for orders placed with `sj_test_` keys. Sandbox orders never reach operations.
        received_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Time of the most recent change to the order, including status transitions.
        events:
          type: array
          description: Status history, oldest first.
          items:
            $ref: '#/components/schemas/OrderEvent'

    OrderCancelRequest:
      type: object
      description: Optional body for `POST /v1/orders/{id}/cancel`.
      properties:
        note:
          type: string
          maxLength: 1000
          description: Why the order is being cancelled. Recorded on the event; defaults to `cancelled by partner`.
          examples: [Customer changed the panel selection]
      additionalProperties: false

    OrderList:
      type: object
      required: [as_of, items, next_cursor]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: |
            The newest `updated_at` on this page. Pass it as `updated_since`
            on the next poll; the last order on this page comes back once
            more, which is the price of never missing one.
        items:
          type: array
          description: Oldest first by `updated_at`, then by `id`.
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    # Health

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
